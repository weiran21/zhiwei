}
.cal-grid-v2 .day.has-event{font-weight:600;}
.cal-grid-v2 .day.today{
  background:var(--primary);color:#fff;font-weight:700;
  box-shadow:0 2px 8px rgba(143,170,134,.3);
}
.cal-grid-v2 .day.today .dot-mark{background:#fff;}
.cal-grid-v2 .day.selected:not(.today){
  background:var(--primary-bg);color:var(--primary);font-weight:700;
}

.cal-date-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:18px 0 10px;
}
.cal-date-head .cal-date-title{
  font-size:15px;font-weight:700;color:var(--text);
}
.cal-date-head .cal-date-title .cal-week{color:var(--text-sub);font-weight:500;margin-left:4px;}
.cal-date-head .cal-today-tag{
  font-size:11px;padding:3px 10px;border-radius:10px;
  background:var(--primary-bg);color:var(--primary);font-weight:500;
}
.cal-group{margin-bottom:14px;}
.cal-group-head{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--text-sub);
  margin-bottom:8px;padding:0 2px;
}
.cal-group-head .cal-g-dot{width:6px;height:6px;border-radius:50%;}
.cal-group-head .cal-g-count{color:var(--text-light);font-weight:400;}
.cal-task-card{
  display:flex;align-items:center;gap:10px;
  background:var(--bg);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;
  transition:all .15s;cursor:pointer;
}
.cal-task-card:active{transform:scale(.98);}
.cal-task-card .cal-task-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.cal-task-card .cal-task-body{flex:1;min-width:0;}
.cal-task-card .cal-task-tag{
  font-size:10px;color:var(--text-sub);
  display:block;margin-bottom:2px;line-height:1.3;
}
.cal-task-card .cal-task-title{
  font-size:13px;color:var(--text);font-weight:600;
  line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-task-card .cal-task-arrow{
  color:var(--text-light);font-size:14px;flex-shrink:0;
}
.cal-task-card.todo .cal-task-icon{background:#F0E4DA;color:#B8896B;}
.cal-task-card.company .cal-task-icon{background:#DCEAD7;color:#5B8B5A;}
.cal-task-card.auction .cal-task-icon{background:#FBE0D3;color:#D87B4A;}
.cal-task-card.todo .cal-task-icon::before{content:"✓";font-weight:700;}
.cal-task-card.company .cal-task-icon::before{content:"🏢";font-size:14px;}
.cal-task-card.auction .cal-task-icon::before{content:"⚖";font-size:14px;}
/* 可爱图标模式 */
[data-icons="cute"] .cal-task-card{border-radius:18px;}
[data-icons="cute"] .cal-task-card .cal-task-icon{border-radius:12px;}

/* 周视图 */
.week-view{display:flex;flex-direction:column;gap:4px;}
.week-view .week-row{
  display:flex;gap:4px;align-items:stretch;
}
.week-view .week-day{
  flex:1;text-align:center;font-size:10px;padding:6px 2px;border-radius:var(--radius-sm);
  background:var(--card-bg);cursor:pointer;
}
.week-day .d-num{font-size:14px;font-weight:600;}
.week-day .d-events{font-size:8px;color:var(--text-sub);margin-top:2px;}

/* ============ 项目平台 ============ */
.tree-item{
  background:var(--card-bg);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;
}
.tree-item .tree-head{
  display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;
}
.tree-item .tree-head .arrow{
  width:16px;height:16px;transition:transform .2s;flex-shrink:0;color:var(--text-sub);
}
.tree-item .tree-head .arrow .icon-wrap{width:100%;height:100%;}
.tree-item .tree-head .arrow svg{width:100%;height:100%;display:block;}
.tree-item.open .tree-head .arrow{transform:rotate(90deg);}
.tree-item .tree-head .icon-box{
  width:32px;height:32px;border-radius:var(--radius-sm);background:var(--primary-bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tree-item .tree-head .icon-box svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tree-item .tree-head .label{flex:1;font-size:13px;font-weight:600;}
.tree-item .tree-head .count{font-size:11px;color:var(--text-sub);background:var(--primary-bg);padding:2px 8px;border-radius:8px;}
.tree-children{display:none;padding:0 8px 8px;}
.tree-item.open .tree-children{display:block;}

.project-card{
  background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:6px;
  border:1px solid var(--border);
}
.project-card .pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.project-card .pc-name{font-size:13px;font-weight:600;flex:1;}
.project-card .pc-status{font-size:10px;padding:2px 8px;border-radius:6px;}
.project-card .pc-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;}
.project-card .pc-field{font-size:11px;}
.project-card .pc-field .k{color:var(--text-sub);}
.project-card .pc-field .v{color:var(--text);font-weight:500;}
.project-card .pc-notes{font-size:11px;color:var(--text-sub);margin-top:6px;padding-top:6px;border-top:1px solid var(--divider);}
.project-card .pc-actions{display:flex;gap:6px;margin-top:8px;}
.project-card .pc-actions .act{
  padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;
  background:var(--primary-bg);color:var(--primary);
}
.project-card .pc-actions .act.del{background:#FFF0F0;color:var(--warning);}

/* ============ 法拍案件 ============ */
.case-tree .level-1 .tree-head .icon-box{background:rgba(232,146,60,.12);}
.case-tree .level-1 .tree-head .icon-box svg{stroke:var(--auction);}
.case-tree .level-2 .tree-head .icon-box{background:rgba(59,126,196,.12);}
.case-tree .level-2 .tree-head .icon-box svg{stroke:var(--court);}
.case-tree .level-3 .tree-head .icon-box{background:var(--primary-bg);}
.case-tree .level-3 .tree-head .icon-box svg{stroke:var(--primary);}
.case-tree .level-4 .tree-head .icon-box{background:rgba(232,146,60,.12);}
.case-tree .level-4 .tree-head .icon-box svg{stroke:var(--auction);}
.case-tree .tree-head{padding:10px 12px;}
.case-tree .tree-children{padding:0 6px 6px;}
.case-tree .level-indent{padding-left:12px;}
/* 年份「纯跳转按钮」：去下拉箭头暗示，加右侧导航箭头 + 点击反馈 */
.case-tree .tree-item.year-jump .tree-head.jump{transition:background .15s;}
.case-tree .tree-item.year-jump .tree-head.jump:active{background:var(--primary-bg);}
.case-tree .year-go{margin-left:2px;color:var(--text-sub);font-size:18px;line-height:1;flex-shrink:0;}

.case-detail-card{
  background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:6px;
  border:1px solid var(--border);border-left:3px solid var(--auction);
}
.case-detail-card.warn{border-left-color:var(--warning);background:#FFF8F8;}
.case-detail-card .cd-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.case-detail-card .cd-name{font-size:13px;font-weight:600;flex:1;}
.case-detail-card .cd-fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;}
.case-detail-card .cd-field{font-size:11px;}
.case-detail-card .cd-field .k{color:var(--text-sub);}
.case-detail-card .cd-field .v{color:var(--text);font-weight:500;}
.case-detail-card .cd-actions{display:flex;gap:6px;margin-top:8px;}

/* ============ 第三周关键节点警示进度条 ============ */
.week-warn-card{
  background:linear-gradient(135deg,#FFF5F5,#FFF0F0);
  border:1px solid #FFD0D0;border-left:3px solid var(--warning);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;
}
.week-warn-card .ww-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.week-warn-card .ww-name{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.week-warn-card .ww-date{font-size:10px;color:var(--warning);font-weight:600;}
.week-warn-bar{display:flex;gap:3px;margin-bottom:6px;}
.week-segment{
  flex:1;text-align:center;padding:6px 2px;border-radius:var(--radius-sm);
  background:var(--divider);transition:all .3s;position:relative;
}
.week-segment .ws-day{font-size:9px;color:var(--text-sub);}
.week-segment .ws-date{font-size:11px;font-weight:700;margin-top:2px;}
.week-segment.passed{background:var(--warning);color:#fff;}
.week-segment.passed .ws-day,.week-segment.passed .ws-date{color:#fff;}
.week-segment.current{
  background:var(--warning);color:#fff;
  box-shadow:0 0 0 2px rgba(216,54,54,.3);transform:scale(1.05);
  z-index:2;
}
.week-segment.current::after{
  content:"今天";position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:8px;color:var(--warning);white-space:nowrap;font-weight:700;
}
.week-segment.upcoming{background:var(--divider);opacity:.6;}
.week-segment.future{background:var(--divider);}
.ww-info{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);}
.ww-info .ww-status{color:var(--warning);font-weight:600;}

/* ============ 案件简览卡片 ============ */
.case-brief-card{
  background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;
  border:1px solid var(--border);border-left:3px solid var(--auction);
  transition:all .2s;cursor:pointer;
}
.case-brief-card.warn{border-left-color:var(--warning);background:#FFF8F8;}
.case-brief-card:active{transform:scale(.98);}
.case-brief-card .cb-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.case-brief-card .cb-name{font-size:13px;font-weight:600;flex:1;}
.case-brief-card .cb-fields{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;}
.case-brief-card .cb-field{display:flex;align-items:center;gap:3px;}
.case-brief-card .cb-field .k{color:var(--text-sub);font-size:10px;}
.case-brief-card .cb-field .v{color:var(--text);font-weight:500;}
.case-brief-card .cb-warn-tag{
  font-size:9px;padding:1px 6px;border-radius:4px;background:#FFE0E0;color:var(--warning);
  white-space:nowrap;
}

/* 视图模式切换栏 */
.view-toggle-bar{
  display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;
}
.view-toggle{
  display:flex;background:var(--primary-bg);border-radius:var(--radius-sm);overflow:hidden;
}
.view-toggle button{
  padding:5px 12px;font-size:12px;color:var(--text-sub);transition:all .2s;
}
.view-toggle button.active{background:var(--primary);color:#fff;font-weight:600;}
.judge-filter{
  flex:1;min-width:0;
}
.judge-filter select{
  width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card-bg);font-size:12px;color:var(--text);
}
.judge-filter select:focus{border-color:var(--primary);}

/* 页面标题 */
.page-title{
  display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--text);
  margin-bottom:10px;
}
.page-title .pt-emoji{width:22px;height:22px;display:inline-flex;}
.page-title .pt-emoji svg{width:22px;height:22px;}

/* 顶部双下拉筛选（法官 + 法院并排） */
.case-filter-row{display:flex;gap:8px;margin-bottom:10px;}
.case-filter-col{flex:1;min-width:0;}
.cf-label{font-size:11px;color:var(--text-sub);margin-bottom:4px;display:flex;align-items:center;gap:3px;}
.cf-dropdown{position:relative;}
.cf-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card-bg);font-size:12px;color:var(--text);cursor:pointer;text-align:left;
}
.cf-dropdown.open .cf-trigger{border-color:var(--primary);}
.cf-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-caret{transition:transform .25s;flex-shrink:0;color:var(--text-sub);font-size:9px;}
.cf-dropdown.open .cf-caret{transform:rotate(180deg);}
.cf-panel{
  /* fixed 定位：脱离任何父容器堆叠，展开后盖在法院框/案件列表上方 */
  position:fixed;z-index:88;
  background:var(--card-bg);border:1px solid transparent;border-radius:var(--radius-sm);
  max-height:0;opacity:0;transform:translateY(-10px) scale(.98);overflow:hidden;pointer-events:none;
  padding:0 4px;box-shadow:none;visibility:hidden;
  /* 收起态 visibility 无延迟：切换时旧面板立即隐藏，避免与新面板瞬间叠盖 */
  transition:max-height .3s cubic-bezier(.22,.61,.36,1),opacity .22s ease,transform .25s cubic-bezier(.22,.61,.36,1),padding .22s ease,border-color .22s ease,box-shadow .25s ease,visibility 0s linear 0s;
}
.cf-panel.show{
  max-height:min(60vh,360px);opacity:1;transform:translateY(0);overflow-y:auto;pointer-events:auto;
  padding:4px;border-color:var(--border);box-shadow:0 14px 36px rgba(0,0,0,.18);visibility:visible;
  transition:max-height .3s cubic-bezier(.22,.61,.36,1),opacity .22s ease,transform .25s cubic-bezier(.22,.61,.36,1),padding .22s ease,border-color .22s ease,box-shadow .25s ease,visibility 0s linear 0s;
}
/* 承办法官下拉面板层级(99)永远高于受理法院面板(88)，从机制上保证法院不遮住法官 */
.cf-dropdown#judgeDropdown .cf-panel{ z-index:99; }
.cf-option{padding:9px 8px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cf-option:hover,.cf-option.active{background:var(--primary-bg);color:var(--primary);font-weight:600;}
.cf-overlay{display:none;position:fixed;inset:0;z-index:80;background:transparent;cursor:pointer;}
.cf-overlay.show{display:block;}
.filter-clear{
  font-size:11px;color:var(--warning);cursor:pointer;padding:5px 10px;
  background:var(--warning-bg,#FCE8E8);border-radius:var(--radius-sm);margin-left:auto;
}
@media (max-width:480px){
  .case-filter-row{flex-wrap:wrap;}
  .case-filter-col{flex:1 1 100%;}
}

/* 案件状态标签（7 类差异化低饱和配色 + 水果角标） */
.case-status-tag{
  display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:8px;white-space:nowrap;line-height:1.3;flex-shrink:0;
  border:1px solid transparent;
}
.case-status-tag .cst-fruit{font-size:10px;opacity:.5;}
.case-status-tag.st-ypz{background:#FCE9D6;color:#C5732A;border-color:#F2C9A3;}
.case-status-tag.st-ypfp{background:#E4ECF3;color:#4A6B86;border-color:#C4D4E2;}
.case-status-tag.st-epz{background:#DCEAF6;color:#2E6DA4;border-color:#B6D2EC;}
.case-status-tag.st-epfp{background:#E6E6EA;color:#5A5A66;border-color:#CFCFD6;}
.case-status-tag.st-bmz{background:#ECE2F7;color:#6E4C9E;border-color:#D3BFEA;}
.case-status-tag.st-bmfp{background:#DAD4E2;color:#52496A;border-color:#BFB6CC;}
.case-status-tag.st-over{background:#DCEFE0;color:#3E7A4C;border-color:#B9DCC0;}
.case-status-tag.st-default{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-light);}

/* 卡片底部（预警 + 提醒）+ 进行中醒目标识 */
.case-brief-card .cb-foot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.case-brief-card{position:relative;}
.case-brief-card.ongoing{
  border-left:3px solid var(--auction);
  box-shadow:0 2px 10px rgba(232,146,60,.18);
  background:linear-gradient(90deg, rgba(232,146,60,.06), var(--bg) 45%);
}
.case-brief-card.ongoing::before{
  content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;
  background:var(--auction);box-shadow:0 0 0 3px rgba(232,146,60,.22);
}
/* 详情卡片头右侧容器 */
.case-detail-card .cd-head-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}

/* ============ 搜索 ============ */
.search-box{
  display:flex;gap:8px;margin-bottom:12px;
}
.search-box input{
  flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card-bg);font-size:13px;
}
.search-box input:focus{border-color:var(--primary);}
.search-box .btn-search{
  width:40px;height:40px;border-radius:var(--radius-sm);background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
[data-icons="cute"] .search-box .btn-search{border-radius:50%;}

.search-result{
  background:var(--card-bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:6px;cursor:pointer;
  transition:all .2s;
}
.search-result:active{transform:scale(.98);}
.search-result .sr-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.search-result .sr-meta{font-size:11px;color:var(--text-sub);display:flex;gap:8px;flex-wrap:wrap;}
.search-result .sr-highlight{color:var(--primary);font-weight:600;}

/* ============ 智能检索：域名切换 + 实时联想下拉 ============ */
.domain-toggle{
  display:flex;gap:6px;margin-bottom:12px;background:var(--primary-bg);
  padding:4px;border-radius:var(--radius-sm);
}
.domain-toggle .dt-item{
  flex:1;text-align:center;padding:8px 6px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;color:var(--text-sub);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.domain-toggle .dt-item.active{background:var(--card-bg);color:var(--primary);box-shadow:0 2px 8px var(--shadow);}
.domain-toggle .dt-item .dt-ico{font-size:15px;}

/* 搜索框（相对定位容器，承载清空按钮 + 联想下拉） */
.search-box{position:relative;display:flex;gap:8px;margin-bottom:12px;}
.search-input-wrap{position:relative;flex:1;}
.search-input-wrap input{
  width:100%;padding:10px 38px 10px 14px;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);background:var(--card-bg);font-size:13px;box-sizing:border-box;
}
.search-input-wrap input:focus{border-color:var(--primary);}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;border:none;background:var(--divider);
  color:var(--text-sub);font-size:13px;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center;
}
.search-clear:hover{background:var(--warning);color:#fff;}

/* 实时联想下拉（不新增弹窗层级，仅作辅助列表） */
.suggest-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:var(--card-bg);border:1px solid transparent;border-radius:var(--radius-sm);
  max-height:0;opacity:0;transform:translateY(-10px);overflow-y:hidden;pointer-events:none;
  padding:0 4px;box-shadow:none;
  transition:max-height .3s cubic-bezier(.22,.61,.36,1), opacity .22s ease, transform .25s ease, padding .22s ease, border-color .22s ease, box-shadow .25s ease;
}
.suggest-dropdown.show{
  max-height:320px;opacity:1;transform:translateY(0);overflow-y:auto;pointer-events:auto;
  padding:4px;border-color:var(--border);box-shadow:0 8px 24px var(--shadow);
}
.suggest-hint{font-size:10px;color:var(--text-sub);padding:4px 8px;}
.suggest-item{
  display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .15s;
}
.suggest-item:hover,.suggest-item.active{background:var(--primary-bg);}
.suggest-tag{
  flex-shrink:0;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;
  background:var(--primary-bg);color:var(--primary);border:1px solid var(--primary-light);
}
.suggest-tag.t-company{background:#EAF1E7;color:#5C7355;border-color:#C5D8BC;}
.suggest-tag.t-project{background:#E6EEF7;color:#3B6CA8;border-color:#C2D6EC;}
.suggest-tag.t-buyer{background:#F3EAF7;color:#7A4C9E;border-color:#D9C2EA;}
.suggest-tag.t-court{background:#E7EEF6;color:#2E6DA4;border-color:#BED2EC;}
.suggest-tag.t-judge{background:#F0E9DD;color:#9A6A2A;border-color:#E2CFA8;}
.suggest-tag.t-applicant{background:#ECE7F2;color:#5E4C9E;border-color:#CFC2EA;}
.suggest-tag.t-case{background:#FBEDE0;color:#C5732A;border-color:#F0CDAB;}
.suggest-val{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.suggest-val .hl{color:var(--primary);font-weight:600;}
.suggest-empty{font-size:12px;color:var(--text-sub);padding:10px 8px;text-align:center;}

/* 命中条数提示条 */
.match-banner{
  font-size:11px;color:var(--text-sub);background:var(--primary-bg);
  padding:7px 12px;border-radius:var(--radius-sm);margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.match-banner b{color:var(--primary);font-weight:700;}
.match-banner .mb-reset{margin-left:auto;color:var(--warning);cursor:pointer;font-size:11px;}

/* ============ 外观装扮中心 ============ */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
/* 水果主题卡片（装扮中心用） */
.fruit-card{
  background:var(--card-bg);
  border-radius:14px;padding:0;cursor:pointer;transition:all .2s;
  border:2px solid transparent;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.fruit-card.active{border-color:var(--primary);box-shadow:0 4px 14px var(--primary-bg);}
.fruit-preview{
  height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;position:relative;
}
.fruit-emoji{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.06));}
.fruit-dots{display:flex;gap:3px;}
.fruit-dots > div{width:8px;height:8px;border-radius:50%;}
.fruit-info{padding:4px 6px 8px;text-align:center;}
.fruit-info .t-name{font-size:11px;font-weight:600;}
.fruit-mood{font-size:9px;color:var(--text-sub);margin-top:1px;letter-spacing:.3px;line-height:1.3;}
.fruit-card .check{
  position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;
  background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
}
.fruit-card:not(.active) .check{display:none;}

/* 早间/晚间/跟随系统三选一 */
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mode-card{
  background:var(--card-bg);
  border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;
  border:2px solid transparent;transition:all .2s;
}
.mode-card.active{border-color:var(--primary);background:var(--primary-bg);}
.mode-emoji{font-size:26px;margin-bottom:4px;}
.mode-name{font-size:12px;font-weight:600;color:var(--text);}
.mode-desc{font-size:10px;color:var(--text-sub);margin-top:2px;}

.theme-card{
  border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;
  border:2px solid transparent;position:relative;overflow:hidden;
}
.theme-card.active{border-color:var(--primary);}
.theme-card .preview{
  height:50px;border-radius:var(--radius-sm);margin-bottom:8px;position:relative;overflow:hidden;
}
.theme-card .preview .p-bar{position:absolute;bottom:0;left:0;right:0;height:14px;}
.theme-card .preview .p-circle{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;}
.theme-card .t-name{font-size:12px;font-weight:600;text-align:center;}
.theme-card .check{
  position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;
}
.theme-card.active .check{display:flex;}

.icon-style-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.icon-style-card{
  padding:8px 4px;cursor:pointer;transition:all .2s;
  border:2px solid transparent;background:var(--card-bg);text-align:center;
  border-radius:12px;
}
.icon-style-card.active{border-color:var(--primary);background:var(--primary-bg);}
.icon-style-card .isc-preview{
  width:34px;height:34px;margin:0 auto 4px;border-radius:10px;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
}
.icon-style-card .isc-preview svg{width:24px;height:24px;display:block;}
.icon-style-card .isc-name{font-size:10px;font-weight:600;line-height:1.2;}
.icon-style-card .isc-desc{font-size:9px;color:var(--text-sub);margin-top:1px;line-height:1.2;}

/* ============ 折叠下拉通用样式 ============ */
.fold-block{border:1.5px solid var(--border);border-radius:14px;background:var(--card-bg);margin-bottom:10px;overflow:hidden;}
.fold-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;user-select:none;
  background:var(--card-bg);transition:background .2s;
}
.fold-head:active{background:var(--primary-bg);}
.fold-head .fold-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);}
.fold-head .fold-title .fn-icon{font-size:14px;}
.fold-head .fold-meta{font-size:10px;color:var(--text-sub);display:flex;align-items:center;gap:6px;}
.fold-head .fold-chev{display:inline-block;width:12px;height:12px;border-right:2px solid var(--text-sub);border-bottom:2px solid var(--text-sub);transform:rotate(-45deg);transition:transform .25s;margin-right:3px;}
.fold.open .fold-chev{transform:rotate(45deg);}
.fold-body{display:none;padding:6px 14px 14px;border-top:1px solid var(--divider);}
.fold.open .fold-body{display:block;}
.fold-hint{font-size:11px;color:var(--text-sub);margin:4px 0 8px;line-height:1.4;}

/* 装扮中心内部小折叠 */
.opt-fold{margin-top:10px;border:1px solid var(--divider);border-radius:12px;background:var(--bg);overflow:hidden;}
.opt-fold-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;cursor:pointer;user-select:none;
}
.opt-fold-head:active{background:var(--primary-bg);}
.opt-fold-head .of-title{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;}
.opt-fold-head .of-chev{display:inline-block;width:8px;height:8px;border-right:1.6px solid var(--text-sub);border-bottom:1.6px solid var(--text-sub);transform:rotate(-45deg);transition:transform .25s;}
.opt-fold.open .of-chev{transform:rotate(45deg);}
.opt-fold-body{display:none;padding:0 12px 10px;}
.opt-fold.open .opt-fold-body{display:block;}

/* ============ 悬浮按钮 ============ */
.fab{
  position:fixed;bottom:18px;right:18px;width:58px;height:58px;
  border-radius:50%;background:var(--fab-color);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 6px 12px var(--shadow), 0 2px 6px rgba(0,0,0,.18);
  z-index:9999;transition:all .2s;
  border:none;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
}
.fab:active{transform:scale(.92);}
.fab.dragging{transform:none !important;transition:none;box-shadow:0 10px 22px var(--shadow), 0 3px 8px rgba(0,0,0,.2);}
.fab-menu{
  position:fixed;display:none;flex-direction:column;gap:6px;z-index:9999;max-width:70vw;
}
.fab-menu.show{display:flex;}
.fab-menu .fab-item{
  padding:8px 16px;border-radius:var(--radius-sm);background:var(--card-bg);
  box-shadow:0 2px 8px var(--shadow);font-size:12px;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.fab-menu .fab-item:active{opacity:.6;}

/* ============ 编辑弹层 ============ */
.sheet-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.01);z-index:30;display:none;
}
.sheet-overlay.show{display:block;}
.sheet{
  position:absolute;bottom:0;left:0;right:0;background:var(--card-bg);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:16px;
  box-shadow:0 -4px 20px var(--shadow);z-index:31;
  transform:translateY(100%);transition:transform .3s;max-height:80%;overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.sheet .sheet-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:14px;}
.sheet .form-group{margin-bottom:12px;}
.sheet .form-group label{font-size:12px;color:var(--text-sub);display:block;margin-bottom:4px;}
.sheet .form-group input,.sheet .form-group textarea,.sheet .form-group select{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);font-size:13px;
}
.sheet .form-group input:focus,.sheet .form-group textarea:focus{border-color:var(--primary);}
.sheet .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sheet .btn-row{display:flex;gap:8px;margin-top:14px;}
.sheet .btn-row button{flex:1;padding:10px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;}
.sheet .btn-save{background:var(--primary);color:#fff;}
.sheet .btn-cancel{background:var(--primary-bg);color:var(--text-sub);}

/* ============ 法院工作小工具 ============ */
.tool-page{ padding-bottom:72px; }
.tools-landing{ padding:14px; }
.tools-hero{ background:linear-gradient(135deg,var(--primary-bg),var(--card-bg)); border-radius:var(--radius-lg); padding:18px 16px; margin-bottom:14px; box-shadow:0 2px 10px var(--shadow); }
.tools-hero-title{ font-size:18px;font-weight:800;color:var(--text); }
.tools-hero-sub{ font-size:12px;color:var(--text-sub);margin-top:4px; }
.tools-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
.tool-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:0 2px 10px var(--shadow); cursor:pointer; transition:transform .15s,box-shadow .15s; }
.tool-card:active{ transform:scale(.98); }
.tool-card-ic{ width:42px;height:42px;border-radius:12px; background:var(--primary-bg); display:flex;align-items:center;justify-content:center; margin-bottom:10px; }
.tool-card-ic .icon-wrap, .tool-card-ic svg{ width:24px;height:24px; }
.tool-card-label{ font-size:15px;font-weight:700;color:var(--text); }
.tool-card-desc{ font-size:12px;color:var(--text-sub);margin-top:3px; line-height:1.5; }
.tool-card-go{ font-size:12px;color:var(--primary);font-weight:600;margin-top:8px; }

.tool-head{ display:flex;align-items:center;justify-content:space-between; padding:14px 14px 8px; }
.tool-head-title{ font-size:17px;font-weight:800;color:var(--text); }
.tool-head-sub2{ font-size:12px;color:var(--text-sub);padding:0 14px 8px; }
.tool-head.with-back{ gap:8px; }
.back-btn{ background:var(--primary-bg);color:var(--primary-text,var(--text)); border:none; border-radius:var(--radius-sm); padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; }
.ghost-btn{ background:var(--primary-bg);color:var(--primary-text,var(--text)); border:none; border-radius:var(--radius-sm); padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
.search-bar{ padding:4px 14px 10px; }
.search-input{ width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); font-size:13px; box-sizing:border-box; }
.search-input:focus{ border-color:var(--primary); }

.court-list, .judge-list{ padding:0 14px; }
.court-card-row{ display:flex; align-items:center; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; box-shadow:0 1px 6px var(--shadow); cursor:pointer; }
.ccr-main{ flex:1; min-width:0; }
.ccr-name{ font-size:14px;font-weight:700;color:var(--text); }
.ccr-meta{ font-size:11px;color:var(--text-sub);margin-top:3px; }
.ccr-go{ font-size:20px;color:var(--text-sub); margin-left:8px; }
.row-actions{ display:flex; gap:6px; margin-left:8px; }
.icon-btn{ width:32px;height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg); display:flex;align-items:center;justify-content:center; cursor:pointer; padding:0; }
.icon-btn svg{ width:16px;height:16px; stroke:var(--text-sub); fill:none; }
.icon-btn.danger svg{ stroke:#E57373; }
.icon-btn:active{ opacity:.6; }

.judge-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; box-shadow:0 1px 6px var(--shadow); }
.jc-top{ display:flex;align-items:center;justify-content:space-between; }
.jc-name{ font-size:14px;font-weight:700;color:var(--text); }
.jc-info{ font-size:12px;color:var(--text-sub); margin-top:8px; line-height:1.8; }
.jc-note{ color:var(--text); }

.calc-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin:0 14px 12px; box-shadow:0 2px 10px var(--shadow); }
.form-label-sm{ font-size:12px;color:var(--text-sub);margin:6px 0 8px; }
.radio-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.radio-pill{ display:flex;align-items:center;gap:6px; padding:9px 10px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:12px;color:var(--text); cursor:pointer; background:var(--bg); }
.radio-pill.active{ border-color:var(--primary); background:var(--primary-bg); color:var(--primary-text,var(--text)); font-weight:600; }
.radio-pill input{ display:none; }
.calc-btn{ width:100%; margin-top:14px; padding:12px; border:none; border-radius:var(--radius-sm); background:var(--primary); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
.calc-btn:active{ opacity:.85; }

.result-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin:0 14px; box-shadow:0 2px 10px var(--shadow); }
.result-title{ font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px; }
.result-row{ display:flex;align-items:center;justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--divider); font-size:13px;color:var(--text-sub); }
.result-row b{ color:var(--text); font-size:14px; }
.result-row.hl b{ color:var(--primary); font-size:16px; }
.result-sub{ font-size:11px;color:var(--text-sub); text-align:right; margin-top:-2px; }
.result-note{ font-size:11px;color:var(--text-sub); margin-top:10px; line-height:1.6; background:var(--primary-bg); border-radius:var(--radius-sm); padding:8px 10px; }
.result-actions{ margin-top:12px; display:flex; justify-content:flex-end; }
/* 节假日标签 */
.dtag{ display:inline-block; font-size:10px; line-height:1; padding:3px 6px; border-radius:10px; margin-left:6px; font-weight:600; vertical-align:middle; white-space:nowrap; }
.dtag.holiday{ background:#FDECEA; color:#D6453D; }
.dtag.weekend{ background:#EEF1F5; color:#7A8699; }
.dtag.makeup{ background:#FFF4E0; color:#C8881B; }
.dtag.work{ background:#E7F6EC; color:#2E9E5B; }
/* 节假日数据状态条 */
.holiday-bar{ margin:0 14px 12px; font-size:11px; color:var(--text-sub); background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; }
.holiday-bar b{ color:var(--text); }
.link{ color:var(--primary); text-decoration:underline; cursor:pointer; margin-left:4px; }
/* 校正弹层 */
.form-tip{ font-size:12px; color:var(--text-sub); margin-bottom:12px; line-height:1.6; }
.btn-col{ display:flex; flex-direction:column; gap:10px; }
.btn-col .btn-save.ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
.copy-btn{ width:100%; margin-top:12px; padding:10px; border:1.5px solid var(--primary); border-radius:var(--radius-sm); background:transparent; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; }

.hist-filter{ display:flex; gap:8px; padding:0 14px 8px; }
.mini-select{ padding:9px 8px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); font-size:12px; color:var(--text); flex:1; }
.hist-toolbar{ display:flex;align-items:center;justify-content:space-between; padding:0 14px 8px; font-size:12px;color:var(--text-sub); }
.link-danger{ background:none;border:none;color:#E57373;font-size:12px;cursor:pointer; font-weight:600; }
.hist-list{ padding:0 14px; }
.hist-item{ display:flex; align-items:center; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 5px var(--shadow); }
.hist-check{ margin-right:8px; display:flex; align-items:center; }
.hist-main{ flex:1; min-width:0; cursor:pointer; }
.hist-line1{ font-size:13px;color:var(--text); }
.hist-line1 b{ color:var(--primary); }
.hist-line2{ font-size:11px;color:var(--text-sub); margin-top:3px; }

.tool-tabbar{ position:fixed; left:0; right:64px; bottom:0; height:52px; background:var(--card-bg); border-top:1px solid var(--border); display:flex; z-index:50; box-shadow:0 -2px 10px var(--shadow); }
.tt-item{ flex:1; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-sub); cursor:pointer; }
.tt-item.active{ color:var(--primary); font-weight:700; }
.req{ color:#E57373; }
.empty-state{ text-align:center; padding:30px 16px; color:var(--text-sub); }
.empty-state .text{ font-size:13px; }

/* ============ 导入导出弹层 ============ */
.io-sheet .io-section{margin-bottom:16px;}
.io-sheet .io-section .io-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.io-sheet .io-section .io-desc{font-size:11px;color:var(--text-sub);margin-bottom:8px;}
.io-sheet .io-btn{
  padding:12px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;
  text-align:center;font-size:13px;font-weight:600;cursor:pointer;
}
.io-sheet .io-btn.secondary{background:var(--primary-bg);color:var(--primary);}
.io-sheet .io-target{display:flex;gap:8px;margin-bottom:8px;}
.io-sheet .io-target .target-btn{
  flex:1;padding:8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  text-align:center;font-size:12px;cursor:pointer;
}
.io-sheet .io-target .target-btn.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.io-sheet .file-input{display:none;}

/* ============ Toast ============ */
.toast{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);
  font-size:13px;z-index:100;opacity:0;transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ============ 空状态 ============ */
.empty-state{text-align:center;padding:30px 20px;color:var(--text-sub);}
.empty-state .icon{font-size:36px;margin-bottom:8px;opacity:.4;}
.empty-state .text{font-size:13px;}

/* ============ 可爱模式增强 ============ */
[data-icons="cute"] .nav-item .lbl{font-weight:500;}
[data-icons="cute"] .card{box-shadow:0 3px 12px var(--shadow);}
[data-icons="cute"] button{transition:transform .15s;}
[data-icons="cute"] button:active{transform:scale(.92);}
[data-icons="cute"] .task-row{border-radius:var(--radius) !important;}
[data-icons="cute"] .project-card{border-radius:var(--radius) !important;}

/* ============ 启动页 Splash ============ */
#splash{
  position:absolute;inset:0;z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:space-between;
  background:var(--bg);padding:48px 28px 40px;transition:opacity .4s, background .4s;
}
#splash.show{display:flex;animation:splashFadeIn .5s ease;}
@keyframes splashFadeIn{from{opacity:0;}to{opacity:1;}}
#splash .sp-top{text-align:center;margin-top:4vh;width:100%;}
#splash .sp-date{font-size:16px;color:var(--text-sub);letter-spacing:1px;}
#splash .sp-week{font-size:13px;color:var(--text-sub);margin-top:4px;}
#splash .sp-lunar{font-size:12px;color:var(--text-light);margin-top:3px;opacity:.85;}
#splash .sp-time-tag{
  display:inline-block;margin-top:10px;padding:4px 14px;
  border-radius:20px;background:var(--primary-bg);color:var(--primary-text);
  font-size:11px;font-weight:600;letter-spacing:1px;
}
#splash .sp-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 10px;width:100%;}
#splash .sp-emoji{font-size:72px;animation:splashFloat 3s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.08));}
@keyframes splashFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#splash .sp-greeting{font-size:26px;font-weight:700;color:var(--text);line-height:1.4;text-align:center;letter-spacing:.5px;}
#splash .sp-quote{
  font-size:14px;color:var(--primary-text);
  background:var(--primary-bg);
  padding:14px 20px;border-radius:18px;max-width:320px;line-height:1.7;text-align:center;
  border:1px solid var(--divider);
}
#splash .sp-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;}
#splash .sp-btn{
  width:100%;max-width:280px;padding:14px;border-radius:var(--radius);
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;
  box-shadow:0 4px 16px var(--primary-bg);text-align:center;transition:transform .15s;
  cursor:pointer;
}
#splash .sp-btn:active{transform:scale(.97);}
[data-icons="cute"] #splash .sp-btn{border-radius:26px;}
#splash .sp-hint{font-size:11px;color:var(--text-light);}
#splash .sp-no-pop{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);cursor:pointer;user-select:none;margin-top:2px;}
#splash .sp-no-pop input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}

/* 启动页晚间模式（深色护眼） */
#splash.night{background:radial-gradient(ellipse at top, #1A1A2E 0%, #0A0A14 70%);}
#splash.night .sp-date{color:#A8A8C0;}
#splash.night .sp-week{color:#7878A0;}
#splash.night .sp-time-tag{background:rgba(255,255,255,.08);color:#C8C8E0;}
#splash.night .sp-greeting{color:#F0F0F8;text-shadow:0 1px 8px rgba(0,0,0,.3);}
#splash.night .sp-quote{
  background:rgba(255,255,255,.06);
  color:#D0D0E8;
  border-color:rgba(255,255,255,.1);
}
#splash.night .sp-hint{color:#5C5C78;}
#splash.night .sp-no-pop{color:#A8A8C0;}
#splash.night .sp-emoji{filter:drop-shadow(0 6px 16px rgba(122,111,168,.4));}

/* ============ 提醒状态 + 结案归档 ============ */
.remind-tag{font-size:9px;padding:2px 7px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.remind-tag:active{transform:scale(.92);}
.remind-pending{background:#FFE0E0;color:var(--warning);}
.remind-done{background:#D4EDDA;color:#155724;}
.case-detail-card.archived,.case-brief-card.archived{opacity:.55;filter:grayscale(.45);}
.archived-tag{font-size:9px;padding:2px 6px;border-radius:6px;background:#E4E4E4;color:#888;margin-left:4px;}
.closing-box{margin-top:8px;padding:10px;border-radius:var(--radius-sm);background:#FFF8EE;border:1px solid var(--auction);}
.closing-box .cb-title{font-size:11px;font-weight:700;color:var(--auction);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.closing-box .cb-row{display:flex;gap:6px;margin-bottom:6px;}
.closing-box select,.closing-box input{padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card-bg);font-size:12px;flex:1;}
.closing-box .cb-save{margin-top:4px;padding:8px;border-radius:var(--radius-sm);background:var(--auction);color:#fff;text-align:center;font-size:12px;font-weight:600;cursor:pointer;}
.closing-done{font-size:11px;color:#155724;margin-top:6px;display:flex;align-items:center;gap:4px;}

/* 第三周警示已提醒状态（绿色正常） */
.week-warn-card.reminded{border-color:var(--border);background:var(--primary-bg);border-left-color:var(--primary);}
.week-warn-card.reminded .ww-date{color:var(--primary-text);}
.week-warn-card.reminded .week-segment.passed{background:var(--primary);}
.week-warn-card.reminded .week-segment.current{background:var(--primary);box-shadow:0 0 0 2px rgba(143,170,134,.3);}
.week-warn-card.reminded .ww-info .ww-status{color:var(--primary-text);}

/* ============ 全局水果装饰层 + 图标装饰 + 背景纹理（治愈系） ============ */
/* 图标包裹 + 角标水果装饰 */
.icon-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.fruit-deco{
  position:absolute;right:-5px;bottom:-5px;font-size:11px;line-height:1;
  pointer-events:none;opacity:.6;transform:scale(.92);transition:transform .2s,opacity .2s;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));
}
.deco-cute{filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));}
.deco-sticker{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 1px 2px rgba(0,0,0,.18));}
.deco-pixel{image-rendering:pixelated;filter:saturate(.9);}
.deco-line{opacity:.45;}
.fruit-deco svg{width:10px!important;height:10px!important;stroke:none!important;}

/* 全屏低透明度装饰层（角落水果 / 星星 / 云朵） */
#decoLayer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
#decoLayer .dl{
  position:absolute;opacity:var(--deco-opacity);font-size:46px;line-height:1;
  filter:blur(.3px) drop-shadow(0 1px 2px rgba(0,0,0,.04));user-select:none;
}
#decoLayer .dl-star{font-size:18px;opacity:calc(var(--deco-opacity)*.9);color:var(--deco-color);}
#decoLayer .dl-cloud{font-size:40px;opacity:calc(var(--deco-opacity)*.8);}
#app.no-deco-fruit #decoLayer .dl-fruit{display:none;}
#app.no-deco-star #decoLayer .dl-star{display:none;}
#app.no-deco-cloud #decoLayer .dl-cloud{display:none;}

/* 卡片边角迷你水果 */
.card{position:relative;}
.card::after{
  content:var(--deco-fruit);position:absolute;bottom:6px;right:9px;font-size:14px;
  opacity:calc(var(--deco-opacity)*.85);pointer-events:none;user-select:none;
}
#app.no-deco-fruit .card::after{display:none;}

/* 导航选中项侧边小型水果 */
.nav-item.active .ic::after{
  content:var(--deco-fruit);position:absolute;right:-2px;top:-2px;font-size:10px;
  opacity:calc(var(--deco-opacity)*1.4);pointer-events:none;
}
#app.no-deco-fruit .nav-item.active .ic::after{display:none;}

/* 进度条末端水果节点 */
.progress-bar .fill::after{
  content:var(--deco-fruit);position:absolute;right:2px;top:50%;transform:translateY(-50%);
  font-size:9px;opacity:.7;pointer-events:none;
}
#app.no-deco-fruit .progress-bar .fill::after{display:none;}

/* 启动页背景淡水果纹 */
#splash::before{
  content:var(--deco-fruit);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:220px;opacity:.05;pointer-events:none;
}

/* 背景纹理覆盖层（内置纹理 + 自定义图片蒙层） */
#bgTexture{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:var(--bg-texture);background-size:auto;}
#bgTexture.has-image::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.6);}
#app{background:var(--bg);}
#main,#sidebar{position:relative;z-index:2;}
#bgTexture{transition:background-image .3s;}

/* DIY 取色器 / 滑块 样式 */
.diy-section{margin-bottom:6px;}
.diy-color-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.diy-color-item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;}
.diy-color-item label{font-size:11px;color:var(--text-sub);flex:1;line-height:1.2;}
.diy-color-item input[type=color]{
  width:34px;height:34px;border:1.5px solid var(--border);border-radius:10px;padding:2px;background:var(--card-bg);cursor:pointer;flex-shrink:0;
}
.diy-range{display:flex;align-items:center;gap:10px;margin:8px 0;}
.diy-range label{font-size:12px;color:var(--text);min-width:64px;}
.diy-range input[type=range]{flex:1;accent-color:var(--primary);}
.diy-range .rv{font-size:11px;color:var(--text-sub);min-width:54px;text-align:right;}
.diy-toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.diy-toggle{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-sm);
  background:var(--primary-bg);font-size:12px;color:var(--text-sub);cursor:pointer;transition:all .2s;
}
.diy-toggle.on{background:var(--primary);color:#fff;font-weight:600;}
.texture-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.texture-card{
  height:54px;border-radius:var(--radius-sm);cursor:pointer;border:2px solid transparent;
  position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
  font-size:10px;color:var(--text-sub);background:var(--bg);
}
.texture-card.active{border-color:var(--primary);}
.diy-theme-list{display:flex;flex-direction:column;gap:8px;}
.diy-theme-item{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);
  background:var(--bg);border:1px solid var(--border);
}
.diy-theme-item .dt-swatch{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--primary);color:#fff;}
.diy-theme-item .dt-name{flex:1;font-size:13px;color:var(--text);font-weight:600;}
.diy-theme-item .dt-actions{display:flex;gap:6px;}
.diy-theme-item .dt-actions span{
  font-size:11px;padding:4px 8px;border-radius:8px;background:var(--primary-bg);color:var(--primary);cursor:pointer;
}
.diy-theme-item .dt-actions span.del{background:#FFF0F0;color:var(--warning);}
.diy-btn{
  padding:11px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;text-align:center;
  font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;
}
.diy-btn.ghost{background:var(--primary-bg);color:var(--primary);}
.diy-btn.danger{background:#FFF0F0;color:var(--warning);}

/* ============ 响应式 ============ */
@media(max-width:768px){
  /* 预设治愈主题专区：移动端一行 1 个 */
  .theme-grid{grid-template-columns:1fr;}
}
@media(max-width:360px){
  .sidebar-header .name{font-size:11px;}
  .nav-item .lbl{font-size:9px;}
  .time-card .left .clock{font-size:24px;}
}
.native-default-card.active{box-shadow:0 4px 14px var(--shadow);}

/* ============ 多选删除 / 回收站（功能逻辑，复用主题变量，不改动原有外观） ============ */
.btn-danger{background:var(--warning);color:#fff;border:none;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;}
.btn-danger:active{opacity:.85;}
.btn-save.disabled,.btn-danger.disabled{opacity:.4;pointer-events:none;}
.rb-check{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;margin:0;}
.rb-row{display:flex;align-items:flex-start;gap:8px;}
.tree-head .rb-check{margin-top:2px;}
/* 多选模式底部操作条（吸底，不遮挡 FAB：多选时 FAB 已隐藏） */
.multi-bar{display:none;}
.multi-bar.show{display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:sticky;bottom:0;margin-top:12px;padding:12px 14px;border-radius:var(--radius);
  background:var(--primary-bg);box-shadow:0 -2px 10px var(--shadow);}
.multi-bar .mb-info{font-size:13px;color:var(--text-sub);}
.multi-bar .mb-info b{color:var(--primary);font-size:15px;}
.multi-bar .mb-actions{display:flex;gap:8px;}
/* 回收站 */
.recycle-tabs{display:flex;gap:8px;margin-bottom:12px;}
.rc-tab{flex:1;text-align:center;padding:10px;border-radius:var(--radius-sm);background:var(--card-bg);
  font-size:13px;color:var(--text-sub);cursor:pointer;box-shadow:0 2px 8px var(--shadow);}
.rc-tab.active{background:var(--primary);color:#fff;font-weight:600;}
.rb-action-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  font-size:12px;color:var(--text-sub);}
.rb-selall{display:flex;align-items:center;gap:6px;cursor:pointer;}
.rb-clear{color:var(--warning);cursor:pointer;}
.rb-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:var(--radius-sm);
  background:var(--card-bg);margin-bottom:8px;box-shadow:0 2px 8px var(--shadow);}
.rb-item.sel{outline:2px solid var(--primary);}
.rb-main{flex:1;min-width:0;}
.rb-name{font-size:13px;color:var(--text);font-weight:600;}
.rb-tag{font-size:10px;color:var(--primary);background:var(--primary-bg);padding:2px 6px;border-radius:8px;margin-left:4px;}
.rb-meta{font-size:11px;color:var(--text-sub);margin-top:3px;}
.rb-ops{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.rb-op{font-size:12px;color:var(--primary);cursor:pointer;}
.rb-op.del{color:var(--warning);}

/* ============================================================
   手机端兜底（≤600px）：保持「原始左侧栏 + 右侧内容」布局不变
   仅补 html/body 高度与防横向溢出，不改动任何外观/结构
   ============================================================ */
@media (max-width:600px){
  html, body{ height:100%; margin:0; overflow-x:hidden; }
  #app{ height:100%; }
}

  
/* ============================================================
   每日起始页（全屏浮层 · 治愈系苹果绿）
   每日首次打开显示一次，点击"开始今天"后淡出进入主界面
   ============================================================ */
.launch-page{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:#a8c4a2;
  /* 麻布纹理：横向细纹 + 纵向细纹叠出织物感 */
  background-image:
    repeating-linear-gradient(90deg,
      rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px,
      transparent 1px, transparent 4px),
    repeating-linear-gradient(0deg,
      rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px,
      transparent 1px, transparent 4px);
  transition:opacity .55s ease, visibility 0s linear .55s;
}
.launch-page.hidden{
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .55s ease, visibility 0s linear 0s;
}
.launch-bg{
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.10), transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.10), transparent 55%);
  pointer-events:none;
}
.launch-content{
  position:relative; z-index:1;
  text-align:center; color:#ffffff;
  max-width:380px; padding:0 28px;
  animation:launchFadeIn .9s ease both;
}
@keyframes launchFadeIn{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}
.launch-badge{
  width:108px; height:108px; margin:0 auto 38px;
  border-radius:50%;
  background:rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.32);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 22px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.4);
}
.launch-badge svg{width:64px; height:64px; display:block;}
.launch-date{
  font-size:14px; letter-spacing:1.5px; opacity:.92;
  margin:0 0 18px; font-weight:500;
}
.launch-greeting{
  font-size:34px; font-weight:800;
  margin:0 0 22px; letter-spacing:1px;

/* 装扮中心：起始页背景画廊 */

.set-row{

  gap:12px; padding:6px 14px 10px;
}
.set-row .set-name{ font-size:14px; color:var(--text); }
.set-row .set-sub{ font-size:11px; color:var(--text-sub); margin-top:2px; }
.switch{

  position:relative; width:46px; height:26px; border-radius:13px;

}
.switch .knob{
  position:absolute; top:3px; left:3px;
  width:20px; height:20px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:left .25s ease;
}
.switch.on{ background:var(--primary); }

.bg-tile{width:74px;cursor:pointer;position:relative;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--card-bg);}

.bg-thumb{width:100%;height:54px;background-size:cover;background-position:center;background-color:var(--primary-bg);}

}

.court-card{
  display:flex;align-items:center;gap:10px;background:var(--card-bg);

}

.stage-chip{

  background:var(--bg);color:var(--text-sub);border:1px solid var(--border);

.stage-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;}

.court-filter-panel .stage-bar{margin-bottom:8px;}
.court-filter-panel .stage-bar:last-child{margin-bottom:0;}

.stage-bar.collapsible{display:flex;align-items:center;flex-wrap:nowrap;overflow:hidden;margin-bottom:8px;}
.stage-bar.collapsible .base-toggle{flex:0 0 auto;user-select:none;}
.stage-bar.collapsible .chip-rail{
  display:flex;gap:6px;flex:0 0 auto;white-space:nowrap;

.stage-bar.collapsible .chip-rail .stage-chip{flex:0 0 auto;}

.mini-btn{ flex:0 0 auto; padding:6px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--primary-bg); color:var(--primary); font-size:12px; cursor:pointer; white-space:nowrap; }

/* ================================================================
 *  发版强制刷新（PWA 缓存破除）
 *  版本号变化时：注销旧 Service Worker + 清空缓存 + 强制重载，
 *  保证用户刷新一次即可用上最新版，无需手动清缓存。
 * ================================================================ */
(function(){
  var APP_VERSION = 'r56';
  var KEY = 'zhiwei_ver';
  try{
    if(localStorage.getItem(KEY) !== APP_VERSION){
      localStorage.setItem(KEY, APP_VERSION);
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){ try{ r.unregister(); }catch(e){} });
        });
      }
      if('caches' in window){
        caches.keys().then(function(keys){ keys.forEach(function(k){ try{ caches.delete(k); }catch(e){} }); });
      }
      // 跳转到带时间戳的 URL，彻底绕过浏览器/代理缓存
      var base = location.href.split('#')[0];
      var sep = base.indexOf('?') >= 0 ? '&' : '?';
      location.replace(base + sep + 'v=' + Date.now());
    }
  }catch(e){}
})();
</script>

// 根据小时返回时段 key
function splashHourKey(h){
  if(h>=5 && h<8) return 'dawn';
  if(h>=8 && h<11) return 'morning';
  if(h>=11 && h<14) return 'noon';
  if(h>=14 && h<18) return 'afternoon';
  if(h>=18 && h<22) return 'evening';
  return 'night';
}

// 按需求合并为 3 个时段池（晨 05:00-11:59 / 午 12:00-17:59 / 夜 18:00-次日04:59）
const SPLASH_PERIOD = {
  morning: [ ...SPLASH_QUOTES.dawn, ...SPLASH_QUOTES.morning ],
  noon:    [ ...SPLASH_QUOTES.noon, ...SPLASH_QUOTES.afternoon ],
  night:   [ ...SPLASH_QUOTES.evening, ...SPLASH_QUOTES.night ],
};
// 按日期种子稳定随机：同一天同一时段复现，不随刷新抖动
function pickSplashQuote(period, dateKey){
  const pool = SPLASH_PERIOD[period] || SPLASH_PERIOD.morning;
  let seed = 0;
  const str = dateKey + '|' + period;
  for (let i=0;i<str.length;i++){ seed = (seed*31 + str.charCodeAt(i)) >>> 0; }
  return pool[seed % pool.length];
}

/* 按日期 key (YYYY-MM-DD) 取当天好句——连续天数取模，确保每日更新且可复现 */
function getDailyQuote(dateKey){
  const [y,m,d] = dateKey.split('-').map(Number);
  const date = new Date(y, (m||1)-1, d||1);
  const epoch = new Date(2026,0,1);
  let dayIdx = Math.floor((date - epoch) / 86400000);
  if(!isFinite(dayIdx) || dayIdx < 0) dayIdx = 0;
  const n = DAILY_QUOTES.length;
  return DAILY_QUOTES[((dayIdx % n) + n) % n];
}

function fmtDateCN(str){
  if(!str) return '未设置';
  const d = new Date(str);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '-';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function daysBetween(d1,d2){
  return Math.round((new Date(d2)-new Date(d1))/86400000);
}
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function isToday(dateStr){ return daysUntil(dateStr)===0; }
function isThisWeek(dateStr){
  const d = daysUntil(dateStr);
  return d>=0 && d<7;
}
function isThisMonth(dateStr){
  const d = new Date(dateStr); const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
}
function isOverdue(dateStr){
  return daysUntil(dateStr)<0;
}
/* 第三周工作日(周一至周五)关键节点计算 */
function getThirdWeekDays(auctionEndDate){
  if(!auctionEndDate) return null;
  const end=new Date(auctionEndDate); end.setHours(0,0,0,0);
  // 往后推14天到第三周范围
  const w3=new Date(end); w3.setDate(end.getDate()+14);
  // 找到该周的周一 (getDay: 0=周日, 1=周一...)
  const dow=w3.getDay();
  const monday=new Date(w3);
  monday.setDate(w3.getDate()-((dow+6)%7));
  // 周一至周五共5天
  const days=[];
  const labels=['周一','周二','周三','周四','周五'];
  for(let i=0;i<5;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    days.push({label:labels[i],date:d.toISOString().slice(0,10),dayNum:d.getDate()});
  }
  return {start:days[0].date,end:days[4].date,days};
}
function isInThirdWeek(auctionEndDate){
  const w=getThirdWeekDays(auctionEndDate);
  if(!w) return false;
  const today=new Date().toISOString().slice(0,10);
  return today>=w.start && today<=w.end;
}
function getThirdWeekStatus(auctionEndDate){
  const w=getThirdWeekDays(auctionEndDate);
  if(!w) return null;
  const today=new Date().toISOString().slice(0,10);
  let phase='before'; // before=预警前, active=进行中, after=已过
  if(today<w.start) phase='before';
  else if(today>w.end) phase='after';
  else phase='active';
  const passedCount=w.days.filter(d=>d.date<today).length;
  const currentIdx=w.days.findIndex(d=>d.date===today);
  return {phase,passedCount,currentIdx,days:w.days,start:w.start,end:w.end};
}

/* 马赛克像素水果（奶油低饱和方块） */
function pixelFruit(c){
  const rows=['01110','11111','11111','11111','01110'];

/* ============ 农历日期 ============ */
const LUNAR_DATA = [
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
];
const LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunarYearDays(y){
  let sum = 348;
  for(let i=0x8000;i>0x8;i>>=1) sum += (LUNAR_DATA[y-1900]&i)?1:0;
  return sum + leapDays(y);
}
function leapDays(y){ return leapMonth(y)?(LUNAR_DATA[y-1900]&0x10000?30:29):0; }
function leapMonth(y){ return LUNAR_DATA[y-1900]&0xf; }
function monthDays(y,m){ return (LUNAR_DATA[y-1900]&(0x10000>>m))?30:29; }
function getLunarDate(date){
  let offset = Math.floor((date - new Date(1900,0,31))/86400000);
  let y, temp=0;
  for(y=1900; y<2100 && offset>0; y++){
    temp = lunarYearDays(y); offset -= temp;
  }
  if(offset<0){ offset += temp; y--; }
  let leap = leapMonth(y);
  let isLeap = false;
  let m, days;
  for(m=1; m<13 && offset>0; m++){
    if(leap>0 && m===leap+1 && !isLeap){ --m; isLeap=true; days=leapDays(y); }
    else { days=monthDays(y,m); }
    if(isLeap && m===leap+1) isLeap=false;
    offset -= days;
  }
  if(offset===0 && leap>0 && m===leap+1){
    if(isLeap) isLeap=false; else { isLeap=true; --m; }
  }
  if(offset<0){ offset += days; --m; }
  const month = isLeap ? '闰'+LUNAR_MONTHS[m-1] : LUNAR_MONTHS[m-1];
  const day = LUNAR_DAYS[offset]||'初一';
  return month+'月'+day;
}
