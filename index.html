/* 法定节假日接口模块：内置兜底 + 运行时联网拉取(jsDelivr 镜像 NateScarlet/holiday-cn) + 手动覆盖 */
const Holiday = {
  cache:{}, updatedAt:null, source:'内置',
  init(){ this.cache = (Store.data && Store.data.holidayCache) || {}; this.updatedAt = (Store.data && Store.data.holidayUpdatedAt) || null; this.source = (Store.data && Store.data.holidaySource) || '内置'; },
  lookup(date){ var y=String(date).slice(0,4); var cy=this.cache[y]; if(cy&&cy[date]) return cy[date]; if(HOLIDAY_BUNDLED[date]) return HOLIDAY_BUNDLED[date]; return null; },
  isOffDay(date){
    var ov=(Store.data.holidayOverrides||{})[date];
    if(ov==='work') return false;
    if(ov==='off') return true;
    var rec=this.lookup(date);
    if(rec) return rec[0]===1;
    var d=parseDate(date).getDay();
    return d===0||d===6;
  },
  info(date){
    var ov=(Store.data.holidayOverrides||{})[date];
    var rec=this.lookup(date);
    return { off:this.isOffDay(date), name: rec?rec[1]:'', makeup: !!(rec&&rec[0]===0), override: ov||'auto' };
  },
  setOverride(date,val){
    Store.data.holidayOverrides = Store.data.holidayOverrides || {};
    if(val==='auto') delete Store.data.holidayOverrides[date]; else Store.data.holidayOverrides[date]=val;
    Store.save();
  },
  _apply(year,j){
    if(!j||!j.days) return false;
    var map={}; j.days.forEach(function(d){ map[d.date]=[d.isOffDay?1:0,d.name]; });
    Store.data.holidayCache = Store.data.holidayCache || {};
    Store.data.holidayCache[year]=map;
    Store.data.holidayUpdatedAt=new Date().toISOString();
    Store.data.holidaySource='联网';
    Store.save();
    this.cache=Store.data.holidayCache; this.updatedAt=Store.data.holidayUpdatedAt; this.source='联网';
    return true;
  },
  /* 静默自动更新：首次进入对应年份时拉取最新数据（2027 等未发布年接口返回空，自动沿用内置） */
  ensure(year,onDone){
    if(!year) year=new Date().getFullYear();
    var self=this;
    fetch('https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/'+year+'.json')
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ self._apply(year,j); if(onDone) onDone(); })
      .catch(function(){ if(onDone) onDone(); });
  },
  refresh(year){
    var self=this;
    return new Promise(function(resolve){
      if(!year) year=new Date().getFullYear();
      fetch('https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/'+year+'.json')
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(j){ if(self._apply(year,j)) resolve({ok:true,msg:'节假日数据已联网更新（'+year+'）'}); else resolve({ok:false,msg:'该年份暂无可更新数据'}); })
        .catch(function(){ resolve({ok:false,msg:'联网失败，继续使用内置数据'}); });
    });
  }
};
function diffDays(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function dateTagHTML(date){
  var i=Holiday.info(date);
  if(i.override==='work') return '<span class="dtag work">自定义·上班</span>';
  if(i.override==='off') return '<span class="dtag holiday">自定义·休假</span>';
  if(i.makeup) return '<span class="dtag makeup">'+escHtml(i.name)+'·调休补班</span>';
  if(i.off) return '<span class="dtag holiday">'+escHtml(i.name)+'·法定假日</span>';
  var dow=parseDate(date).getDay();
  if(dow===0||dow===6) return '<span class="dtag weekend">周末</span>';
  return '<span class="dtag work">工作日</span>';
}

function isFuture(s){ var t=new Date(); t.setHours(0,0,0,0); return parseDate(s)>t; }
function copyText(text){ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast('已复制');},function(){fallbackCopy(text);}); } else { fallbackCopy(text); } }

  },

  shiftNote(r){

  copyResult(){ if(!this.result) return; var r=this.result; var prec=r.precision||'fen'; var text='评估价：'+priceFmtPrec(r.evalYuan,prec)+' 元\n一拍起拍价（−15%）：'+priceFmtPrec(r.first,prec)+' 元\n二拍起拍价（−10%）：'+priceFmtPrec(r.second,prec)+' 元'; copyText(text); },

  renderHistory(c){ var recs=Store.data.auctionPriceRecords; if(this.hFrom) recs=recs.filter(function(r){return (r.recordedAt||'').slice(0,10)>=AuctionPrice.hFrom;}); if(this.hTo) recs=recs.filter(function(r){return (r.recordedAt||'').slice(0,10)<=AuctionPrice.hTo;}); if(this.hSearch.trim()) recs=recs.filter(function(r){return AuctionPrice.fmtMoney(r.evalYuan).indexOf(AuctionPrice.hSearch.trim())>=0;});

    return recs.map(function(r){ return '<div class="hist-item"><label class="hist-check"><input type="checkbox" data-hid="'+r.id+'"></label>'+
      '<div class="hist-main" onclick="AuctionPrice.editRecord(\''+r.id+'\')"><div class="hist-line1">评估价 <b>'+AuctionPrice.fmtMoney(r.evalYuan)+'</b></div>'+

/* ============ 数据导入导出 ============ */
const DataIO = {
  importTarget:'project',
  openExport(){
    Sheet.open('导出全部数据', `
      <div class="io-section">
        <div class="io-desc">将所有工作台数据导出为JSON文件，可用于备份或跨设备迁移。</div>
        <div style="font-size:11px;color:var(--text-sub);margin-bottom:8px">
          待办事项：${Store.data.todos.length} 条<br>
          公司项目：${Store.data.projects.length} 个<br>
          法拍案件：${Store.data.cases.length} 件
        </div>
        <div class="io-btn" onclick="DataIO.doExport()">📥 下载JSON备份文件</div>
      </div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="Sheet.close()">关闭</button>
      </div>
    `);
  },
  doExport(){
    const data=JSON.stringify(Store.data,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`知微工作台_备份_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    Sheet.close();
    toast('已导出数据');
  },
  openImport(){
    Sheet.open('导入数据', `
      <div class="io-section">
        <div class="io-title">📥 JSON数据导入</div>
        <div class="io-desc">从备份文件恢复数据，可选择覆盖或合并。</div>
        <input type="file" id="jsonFile" accept=".json" class="file-input" onchange="DataIO.handleJson(event)">
        <div style="display:flex;gap:8px">
          <div class="io-btn secondary" style="flex:1" onclick="document.getElementById('jsonFile').click()">选择JSON文件</div>
        </div>
      </div>
      <div class="io-section">
        <div class="io-title">📄 文档智能导入</div>
        <div class="io-desc">导入Word/Excel/PDF文档，自动解析归类生成数据。</div>
        <div class="io-target">
          <div class="target-btn ${this.importTarget==='project'?'active':''}" onclick="DataIO.setTarget('project')">归类至公司项目</div>
          <div class="target-btn ${this.importTarget==='case'?'active':''}" onclick="DataIO.setTarget('case')">归类至法拍案件</div>
        </div>
        <input type="file" id="docFile" accept=".doc,.docx,.xls,.xlsx,.pdf" class="file-input" onchange="DataIO.handleDoc(event)">
        <div class="io-btn secondary" onclick="document.getElementById('docFile').click()">选择文档文件</div>
      </div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="Sheet.close()">关闭</button>
      </div>
    `);
  },
  setTarget(t){ this.importTarget=t; this.openImport(); },
  handleJson(e){
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.todos||!data.projects||!data.cases) throw new Error('格式不符');
        if(confirm('检测到备份数据，是否覆盖当前数据？\n（确定=覆盖，取消=取消导入）')){
          Store.data=data;
          Store.save();
          Sheet.close();
          Appearance.applyTheme();
          Nav.go('dashboard');
          toast('数据导入成功');
        }
      }catch(err){
        toast('文件格式错误');
      }
    };
    reader.readAsText(file);
  },
  handleDoc(e){
    const file=e.target.files[0];
    if(!file) return;
    const name=file.name;
    const baseName=name.replace(/\.[^.]+$/,'');
    toast('正在解析文档...');
    setTimeout(()=>{
      if(this.importTarget==='project'){
        const comp=Store.data.projects.find(p=>p.company===baseName)||{id:uid('p'),company:baseName,items:[]};
        if(!Store.data.projects.find(p=>p.id===comp.id)) Store.data.projects.push(comp);
        comp.items.push({
          id:uid('pi'), name:baseName+' - 导入项目',
          listTime:Store.dateStr(0), bidTime:Store.dateStr(30),
          listPrice:'', dealPrice:'', buyer:'', contact:'',
          notes:`由文档"${name}"导入`, status:'prep'
        });
        Store.save();
        Sheet.close();
        Nav.go('project');
        toast(`文档已导入至公司项目: ${baseName}`);
      } else {
        const now=new Date();
        Store.data.cases.push({
          id:uid('c'), year:String(now.getFullYear()), month:String(now.getMonth()+1), stage:'一拍',
          name:baseName+' - 导入案件', caseNo:'(待补)', status:'一拍中',
          court:'待补充', applicant:'', judge:'', responsibleJudge:'',
          fee:'', evalPrice:'', firstAuctionTime:Store.dateStr(0), firstAuctionPrice:'',
          secondAuctionTime:'', dealPrice:'', notes:`由文档"${name}"导入`,
          remindStatus:'pending', closing:{filled:false,type:'',amount:'',reportDate:''}, archived:false
        });
        Store.save();
        Sheet.close();
        Nav.go('case');
        toast(`文档已导入至法拍案件`);
      }
    },1200);
  },
  reset(){
    if(!confirm('确定恢复默认数据？当前所有数据将被清除！')) return;
    Store.reset();
    Appearance.applyTheme();
    Nav.go('dashboard');
    toast('已恢复默认数据');
  }
};

/* ============ 启动页控制 ============
 * 原 #splash 启动页已移除（与 #launchPage「启始页」重复，按用户要求只保留第一个）。
 * Splash 保留为 no-op 存根，避免 init() / 残余调用报错。 */
const Splash = {
  key:'zhiwei_splash_date',
  dismissKey:'zhiwei_splash_dismiss',
  _noPop:false,
  check(){},
  setNoPop(v){ this._noPop = !!v; },
  render(){},
  enter(){}
};

  console.log('[知微工作台] 版本:', window.__APP_VER__);

<script>
/* 起始页背景：应用 + 装扮中心切换/上传/删除（全局） */
/* 把图片压缩为较小的 dataURL，避免高清原图超出 localStorage 配额导致保存失败 */
function compressImageToDataURL(src, maxDim, quality, cb){
  var img = new Image();
  img.onload = function(){
    try{
      var w=img.width, h=img.height;
      var scale = Math.min(1, maxDim/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
      var canvas=document.createElement('canvas');
      canvas.width=cw; canvas.height=ch;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,cw,ch);
      cb(canvas.toDataURL('image/jpeg', quality));
    }catch(e){ cb(null); }
  };
  img.onerror = function(){ cb(null); };
  img.src = src;
}
function applyLaunchBgToPage(key){
  var page = document.getElementById('launchPage');
  if(!page) return;
  var settings = (window.Store && Store.data && Store.data.settings) ? Store.data.settings : {};
  var bgs = settings.launchBgs || [];
  if(!key || key==='default'){
    page.style.backgroundImage = '';
    page.classList.remove('has-custom-bg');
    return;
  }
  var idx = parseInt(String(key).replace('idx',''),10);
  var url = bgs[idx];
  if(url){
    // 预加载校验：加载失败自动回退默认背景，避免空白
    var probe = new Image();
    probe.onload = function(){
      page.style.backgroundImage = "url('"+url+"')";
      page.classList.add('has-custom-bg');
    };
    probe.onerror = function(){
      page.style.backgroundImage = '';
      page.classList.remove('has-custom-bg');
      if(settings.launchBgSel === key){
        settings.launchBgSel = 'default';
        try{ if(Store.save) Store.save(); }catch(e){}
      }
    };
    probe.src = url;
  }
}
Appearance.setLaunchBg = function(key){
  if(!Store || !Store.data || !Store.data.settings) return;
  Store.data.settings.launchBgSel = key;
  if(Store.save) Store.save();
  applyLaunchBgToPage(key);
  if(document.getElementById('content')) Appearance.render();
};
Appearance.uploadLaunchBg = function(){
  var inp = document.getElementById('bgFileInput');
  if(!inp) return;
  inp.onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      // 先压缩再存储：手机原图动辄数 MB，会超出 localStorage 配额使保存失败、背景不生效
      compressImageToDataURL(ev.target.result, 1280, 0.72, function(dataUrl){
        if(!dataUrl){ toast('图片处理失败，请换一张试试'); return; }
        var settings = Store.data.settings;
        var bgs = settings.launchBgs || [];
        bgs.push(dataUrl);
        settings.launchBgs = bgs;
        settings.launchBgSel = 'idx'+(bgs.length-1);
        try { if(Store.save) Store.save(); } catch(err){ console.warn('背景保存失败', err); }
        applyLaunchBgToPage('idx'+(bgs.length-1));
        Appearance.render();
      });
    };
    reader.readAsDataURL(file);
  };
  inp.click();
};
Appearance.delLaunchBg = function(idx){
  var settings = Store.data.settings;
  var bgs = settings.launchBgs || [];
  bgs.splice(idx,1);
  settings.launchBgs = bgs;
  if(settings.launchBgSel === 'idx'+idx){
    settings.launchBgSel = 'default';
    applyLaunchBgToPage('default');
  }
  if(Store.save) Store.save();
  Appearance.render();
};
</script>

<script>
/* 起始页：每次打开都显示。
   装扮中心「启始页」开关可整体关闭；起始页上的「今日不显示」可仅今天跳过。
   清除 localStorage 的 zhiwei_launch_date 可取消"今日不显示"。 */
(function(){
  try {
    if (window.Store && Store.data && Store.data.settings && typeof applyLaunchBgToPage === 'function') {
      applyLaunchBgToPage(Store.data.settings.launchBgSel);
    }
  } catch (e) {}
  var page  = document.getElementById('launchPage');
  var btn   = document.getElementById('launchStartBtn');
  var skipBtn = document.getElementById('launchSkipBtn');
  var dateEl = document.getElementById('launchDate');
  if(!page || !btn || !dateEl) return;

  var LS_KEY = 'zhiwei_launch_date';

  // 填充日期（本地时区）
  var now = new Date();
  var month = now.getMonth() + 1;
  var day   = now.getDate();
  var weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  dateEl.textContent = month + '月' + day + '日 · ' + weekdays[now.getDay()];

  var today = now.getFullYear() + '-' + (month<10?'0':'') + month + '-' + (day<10?'0':'') + day;

  // 是否展示：总开关开启 且 今天未被手动跳过
  var settings = (window.Store && Store.data && Store.data.settings) ? Store.data.settings : {};
  var enabled = settings.launchEnabled !== false;
  var suppressedToday = localStorage.getItem(LS_KEY) === today;
  if(!enabled || suppressedToday){
    page.classList.add('hidden');
    page.setAttribute('aria-hidden','true');
  }

  // 开始今天：进入主界面（不记忆，下次打开仍显示）
  btn.addEventListener('click', function(){
    page.classList.add('hidden');
    page.setAttribute('aria-hidden','true');
  });

  // 今日不显示：仅今天跳过，明天照常显示
  if(skipBtn){
    skipBtn.addEventListener('click', function(){
      localStorage.setItem(LS_KEY, today);
      page.classList.add('hidden');
      page.setAttribute('aria-hidden','true');
    });
  }
})();
</script>
