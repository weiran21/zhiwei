        if(st.phase==='active'){
          if(i<st.currentIdx) cls+='passed';
          else if(i===st.currentIdx) cls+='current';
          else if(i===st.currentIdx+1) cls+='upcoming';
          else cls+='future';
        } else if(st.phase==='before'){
          cls+='future';
        } else { // after
          cls+='passed';
        }
        return `<div class="${cls}"><div class="ws-day">${d.label}</div><div class="ws-date">${d.dayNum}</div></div>`;
      }).join('');
      let statusText='';
      if(st.phase==='before') statusText=`距第三周 ${daysUntil(st.start)}天`;
      else if(st.phase==='active') statusText=`第${st.currentIdx+1}天/共5天 已过${st.passedCount}天`;
      else statusText='第三周已结束';
      return `
        <div class="week-warn-card ${reminded?'reminded':''}" onclick="Nav.go('case')" style="cursor:pointer">
          <div class="ww-head">
            <div class="ww-name">${cs.name}</div>
            <div class="ww-date">${fmtDate(st.start)} - ${fmtDate(st.end)}</div>
          </div>
          <div class="week-warn-bar">${segHTML}</div>
          <div class="ww-info">
            <span>${cs.court} · ${cs.stage}</span>
            <span class="ww-status">${statusText}</span>
          </div>
        </div>
      `;
    }).join('');
  }
};

/* ============ 待办备忘录 ============ */
const Todos = {
  filter:'today',
  render(){
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="add-row">
        <input id="todoInput" placeholder="输入待办内容..." onkeydown="if(event.key==='Enter')Todos.quickAdd()">
        <button class="btn-add" onclick="Todos.quickAdd()">+</button>
      </div>
      <div class="filter-bar">
        <div class="filter-chip ${this.filter==='today'?'active':''}" onclick="Todos.setFilter('today')">今日</div>
        <div class="filter-chip ${this.filter==='week'?'active':''}" onclick="Todos.setFilter('week')">本周</div>
        <div class="filter-chip ${this.filter==='month'?'active':''}" onclick="Todos.setFilter('month')">本月</div>
        <div class="filter-chip ${this.filter==='all'?'active':''}" onclick="Todos.setFilter('all')">全部</div>
      </div>
      <div id="todoGroups"></div>
      <div class="todo-restore" onclick="Todos.restoreDone()">↺ 还原已完成</div>
    `;
    this.renderList();
  },
  setFilter(f){ this.filter=f; this.render(); },
  quickAdd(){
    const input = document.getElementById('todoInput');
    const title = input.value.trim();
    if(!title){ toast('请输入待办内容'); return; }
    Store.data.todos.push({
      id: uid('t'), title, date: Store.dateStr(0), time:'',
      priority:'mid', done:false, source:'manual'
    });
    Store.save();
    input.value='';
    this.renderList();
    toast('已添加待办');
  },
  renderList(){
    const el = document.getElementById('todoGroups');
    if(!el) return;
    let todos = Store.data.todos;
    if(this.filter==='today') todos = todos.filter(t=>isToday(t.date));
    else if(this.filter==='week') todos = todos.filter(t=>isThisWeek(t.date));
    else if(this.filter==='month') todos = todos.filter(t=>isThisMonth(t.date));

    const overdue = todos.filter(t=>isOverdue(t.date) && !t.done);
    const today = todos.filter(t=>isToday(t.date));
    const future = todos.filter(t=>daysUntil(t.date)>0);

    let html = '';
    if(overdue.length){
      html += `<div class="date-group"><div class="group-head">已过期 <span class="badge overdue">${overdue.length}</span></div>`;
      html += overdue.map(t=>this.taskRow(t)).join('');
      html += '</div>';
    }
    if(today.length){
      html += `<div class="date-group"><div class="group-head">今日 <span class="badge">${today.length}</span></div>`;
      html += today.map(t=>this.taskRow(t)).join('');
      html += '</div>';
    }
    if(future.length){
      html += `<div class="date-group"><div class="group-head">即将到来 <span class="badge">${future.length}</span></div>`;
      html += future.map(t=>this.taskRow(t)).join('');
      html += '</div>';
    }
    if(!html) html = '<div class="empty-state"><div class="icon">📋</div><div class="text">暂无待办事项</div></div>';
    el.innerHTML = html;
  },
  taskRow(t){
    const warn = t.source==='auction';
    return `
      <div class="task-row ${warn?'warn':''}">
        <div class="checkbox ${t.done?'on':''}" onclick="Todos.toggleDone('${t.id}')"></div>
        ${t.time?`<div class="todo-time ${t.done?'done':''}">${t.time}</div>`:''}
        <div class="info">
          <div class="name ${t.done?'done':''}">${t.title}</div>
          <div class="meta">${fmtDate(t.date)}${warn?' · 预警来源':''}</div>
        </div>
        <div class="actions">
          <div class="act" onclick="Todos.edit('${t.id}')">${getIcon('edit')}</div>
          <div class="act del" onclick="Todos.del('${t.id}')">${getIcon('trash')}</div>
        </div>
      </div>
    `;
  },
  toggleDone(id){
    const t = Store.data.todos.find(x=>String(x.id)===String(id));
    if(t){ t.done=!t.done; Store.save(); this.renderList(); if(Nav.current==='dashboard') Dashboard.renderTodos(); }
  },
  restoreDone(){
    const done = Store.data.todos.filter(t=>t.done);
    if(!done.length){ toast('没有已完成的待办'); return; }
    if(!window.confirm('确定还原所有已完成待办（取消勾选）？')) return;
    done.forEach(t=>{ t.done=false; });
    Store.save();
    if(Nav.current==='dashboard') Dashboard.renderTodos();
    if(Nav.current==='todo') this.renderList();
    toast('已还原 '+done.length+' 条待办');
  },
  edit(id){
    const t = Store.data.todos.find(x=>String(x.id)===String(id));
    if(!t) return;
    Sheet.open('编辑待办', `
      <div class="form-group">
        <label>任务名称</label>
        <input id="ed_title" value="${t.title.replace(/"/g,'&quot;')}">
      </div>
      <div class="form-group">
        <label>时间</label>
        <input type="time" id="ed_time" value="${t.time||''}">
      </div>
      <div class="form-group">
        <label>截止日期</label>
        <input type="date" id="ed_date" value="${t.date}">
      </div>
      <div class="form-group">
        <label>优先级</label>
        <select id="ed_priority">
          <option value="high" ${t.priority==='high'?'selected':''}>高</option>
          <option value="mid" ${t.priority==='mid'?'selected':''}>中</option>
          <option value="low" ${t.priority==='low'?'selected':''}>低</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="Sheet.close()">取消</button>
        <button class="btn-save" onclick="Todos.saveEdit('${id}')">保存</button>
      </div>
    `);
  },
  saveEdit(id){
    const t = Store.data.todos.find(x=>String(x.id)===String(id));
    if(!t) return;
    t.title = document.getElementById('ed_title').value.trim() || t.title;
    t.time = document.getElementById('ed_time').value || '';
    t.date = document.getElementById('ed_date').value || t.date;
    t.priority = document.getElementById('ed_priority').value;
    Store.save();
    Sheet.close();
    this.renderList();
    toast('已保存');
  },
  del(id){
    const t = Store.data.todos.find(x=>String(x.id)===String(id));
    if(!t) return;
    if(!window.confirm('确定删除这条备忘录？')) return;
    Store.data.todos = Store.data.todos.filter(x=>String(x.id)!==String(id));
    Store.save();
    this.renderList();
    if(Nav.current==='dashboard') Dashboard.renderTodos();
    toast('已删除');
  },
  add(title,date){
    Store.data.todos.push({
      id:uid('t'), title:title||'新待办', date:date||Store.dateStr(0), time:'',
      priority:'mid', done:false, source:'manual'
    });
    Store.save();
  }
};

/* ============ 智能日历 ============ */
const Calendar = {
  view:'month',
  curDate:new Date(),
  selectedDate:null,
  render(){
    if(!this.selectedDate) this.selectedDate = this.curDate.toISOString().slice(0,10);
    const c = document.getElementById('content');
    const todayStr = new Date().toISOString().slice(0,10);
    const isToday = this.selectedDate === todayStr;
    const d = new Date(this.selectedDate);
    const dObj = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const weekMap = ['日','一','二','三','四','五','六'];
    c.innerHTML = `
      <div class="cal-sheet">
        <div class="cal-top">
          <div class="cal-title">日历</div>
          <div class="cal-close" onclick="Nav.go('dashboard')">×</div>
        </div>
        <div class="cal-month-nav">
          <div class="cal-m-arrow" onclick="Calendar.prevMonth()">‹</div>
          <div class="cal-m-title" id="calYM">${d.getFullYear()}年${d.getMonth()+1}月</div>
          <div class="cal-m-arrow" onclick="Calendar.nextMonth()">›</div>
        </div>
        <div id="calBody"></div>
        <div class="cal-date-head">
          <div class="cal-date-title">${d.getMonth()+1}月${d.getDate()}日<span class="cal-week">· 周${weekMap[dObj.getDay()]}</span></div>
          ${isToday?'<div class="cal-today-tag">今天</div>':''}
        </div>
        <div id="calDetail"></div>
      </div>
    `;
    this.renderCal();
  },
  setView(v){ this.view=v; this.render(); },
  prevMonth(){
    const d = new Date(this.selectedDate || this.curDate.toISOString().slice(0,10));
    d.setMonth(d.getMonth()-1);
    this.curDate = new Date(d);
    this.selectedDate = d.toISOString().slice(0,10);
    this.render();
  },
  nextMonth(){
    const d = new Date(this.selectedDate || this.curDate.toISOString().slice(0,10));
    d.setMonth(d.getMonth()+1);
    this.curDate = new Date(d);
    this.selectedDate = d.toISOString().slice(0,10);
    this.render();
  },
  prev(){ this.prevMonth(); },
  next(){ this.nextMonth(); },
  today(){
    this.curDate = new Date();
    this.selectedDate = this.curDate.toISOString().slice(0,10);
    this.render();
  },
  renderCal(){
    const body = document.getElementById('calBody');
    if(!body) return;
    if(this.view==='month') this.renderMonth(body);
    else if(this.view==='week') this.renderWeek(body);
    else this.renderDay(body);
    this.renderDetail();
  },
  renderMonth(body){
    const sel = new Date(this.selectedDate);
    const y = sel.getFullYear(), m = sel.getMonth();
    const first = new Date(y,m,1);
    const last = new Date(y,m+1,0);
    const startDay = first.getDay();
    const days = last.getDate();
    const todayStr = new Date().toISOString().slice(0,10);
    let html = '<div class="cal-grid-v2">';
    ['日','一','二','三','四','五','六'].forEach(d=>html+=`<div class="dow">${d}</div>`);
    // 补上前置空白
    const prevLast = new Date(y,m,0).getDate();
    for(let i=startDay-1;i>=0;i--){
      const dayNum = prevLast - i;
      html += `<div class="day other-month">${dayNum}</div>`;
    }
    for(let d=1;d<=days;d++){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const today = todayStr === dateStr;
      const selFlag = this.selectedDate === dateStr;
      const events = this.getEvents(dateStr);
      const dotColor = events.length ? this.getDotColor(events) : '';
      html += `<div class="day ${today?'today':''} ${selFlag&&!today?'selected':''} ${events.length?'has-event':''}" onclick="Calendar.selectDate('${dateStr}')">${d}${events.length?`<div class="dot-mark" style="background:${today?'#fff':dotColor}"></div>`:''}</div>`;
    }
    // 补后置空白保持 6 行
    const total = startDay + days;
    const remain = (7 - total % 7) % 7;
    for(let i=1;i<=remain;i++){
      html += `<div class="day other-month">${i}</div>`;
    }
    html += '</div>';
    body.innerHTML = html;
  },
  renderWeek(body){
    const date = new Date(this.selectedDate || this.curDate);
    const day = date.getDay();
    date.setDate(date.getDate()-day);
    const todayStr = new Date().toISOString().slice(0,10);
    let html = '<div class="cal-grid-v2">';
    ['日','一','二','三','四','五','六'].forEach((d,i)=>{
      const cur = new Date(date);
      cur.setDate(cur.getDate()+i);
      const dateStr = cur.toISOString().slice(0,10);
      const today = todayStr === dateStr;
      const selFlag = this.selectedDate === dateStr;
      const events = this.getEvents(dateStr);
      html += `<div class="day ${today?'today':''} ${selFlag&&!today?'selected':''} ${events.length?'has-event':''}" onclick="Calendar.selectDate('${dateStr}')">${cur.getDate()}${events.length?`<div class="dot-mark" style="background:${today?'#fff':this.getDotColor(events)}"></div>`:''}</div>`;
    });
    html += '</div>';
    body.innerHTML = html;
  },
  renderDay(body){
    body.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-sub);font-size:12px">日视图请使用月历选择日期</div>';
  },
  selectDate(dateStr){
    this.selectedDate = dateStr;
    this.curDate = new Date(dateStr);
    this.render();
  },
  // 收集某一日期的所有事项，按类型返回
  getEvents(dateStr){
    const events = { todo:[], company:[], auction:[] };
    // 1. 待办（手动 + 法拍预警生成的）
    Store.data.todos.forEach(t=>{
      if(t.date === dateStr){
        events.todo.push({
          id: t.id,
          title: t.title,
          tag: t.source==='auction' ? '法拍预警待办' : (t.priority==='high' ? '高优先级待办' : '每日待办'),
          time: t.priority==='high' ? '高' : '',
          raw: t
        });
      }
    });
    // 2. 公司项目（挂牌/竞价/成交）
    Store.data.projects.forEach(p=>p.items.forEach(item=>{
      if(item.listTime === dateStr){
        events.company.push({
          id: item.id, title: item.name,
          tag: `${p.company} · 挂牌`,
          stage: item.status,
          raw: item
        });
      }
      if(item.bidTime === dateStr){
        events.company.push({
          id: item.id+'_bid', title: item.name,
          tag: `${p.company} · 竞价`,
          stage: item.status,
          raw: item
        });
      }
    }));
    // 3. 法拍案件（一拍/二拍/变卖）
    Store.data.cases.forEach(c=>{
      if(c.firstAuctionTime === dateStr){
        events.auction.push({
          id: c.id+'_1', title: c.name+' · 一拍',
          tag: `${c.court} · ${c.stage}`,
          stage: c.stage,
          raw: c
        });
      }
      if(c.secondAuctionTime === dateStr){
        events.auction.push({
          id: c.id+'_2', title: c.name+' · 二拍',
          tag: `${c.court} · ${c.stage}`,
          stage: c.stage,
          raw: c
        });
      }
    });
    return events;
  },
  getDotColor(events){
    if(events.auction.length) return 'var(--auction)';
    if(events.company.length) return 'var(--company)';
    if(events.todo.length) return 'var(--primary)';
    return 'var(--text-sub)';
  },
  renderDetail(){
    const el = document.getElementById('calDetail');
    if(!el) return;
    const events = this.getEvents(this.selectedDate);
    const total = events.todo.length + events.company.length + events.auction.length;
    if(!total){
      el.innerHTML = '<div class="empty-state" style="padding:18px"><div class="icon">📅</div><div class="text">今日无安排</div></div>';
      return;
    }
    const groups = [
      { key:'todo',    label:'需要完成',   color:'#B8896B', items:events.todo },
      { key:'company', label:'公司项目待办', color:'#5B8B5A', items:events.company },
      { key:'auction', label:'法拍待办',   color:'#D87B4A', items:events.auction },
    ];
    let html = '';
    groups.forEach(g=>{
      if(!g.items.length) return;
      html += `<div class="cal-group">
        <div class="cal-group-head">
          <div class="cal-g-dot" style="background:${g.color}"></div>
          <span>${g.label}</span>
          <span class="cal-g-count">· ${g.items.length}项</span>
        </div>`;
      g.items.forEach(it=>{
        const stage = it.stage ? it.stage : (it.priority==='high'?'高优':'普通');
        html += `<div class="cal-task-card ${g.key}" onclick="Calendar.openTask('${g.key}','${it.id}')">
          <div class="cal-task-icon"></div>
          <div class="cal-task-body">
            <span class="cal-task-tag">${it.tag}</span>
            <span class="cal-task-title">${it.title}</span>
          </div>
          <div class="cal-task-arrow" style="font-size:10px;color:var(--text-sub);padding:2px 6px;background:var(--primary-bg);border-radius:6px">${stage}</div>
        </div>`;
      });
      html += '</div>';
    });
    el.innerHTML = html;
  },
  openTask(type, id){
    // 简单跳转：法拍去案件页，待办/项目提示编辑
    if(type==='auction'){ Nav.go('case'); return; }
    if(type==='todo'){
      const t = Store.data.todos.find(x=>String(x.id)===String(id));
      if(t) Todos.edit(t.id);
      return;
    }
    if(type==='company'){
      Nav.go('project');
      return;
    }
  }
};

/* ============ 公司项目平台 ============ */
const Projects = {
  search:'',
  multiSelect:false,          // 多选删除模式
  selected:new Set(),         // 选中令牌：'C:'+companyId 整组 / 'I:'+companyId+':'+itemId 单条
  sub:'main',                 // 子页面视图：main(主页) | year(年份公司页) | company(公司项目页)
  subYear:null,               // 当前年份（Page B / Page C）
  subCompany:null,            // 当前公司（Page C）
  yearSearch:'',              // Page B 顶部搜索关键词
  projectStageFilter:'',      // Page C 阶段筛选：'' 全部阶段 / listing / bidding / done
  projectMonthOpen:{},        // Page C 月份展开状态：month -> true
  projectView:'brief',        // Page C 视图：brief(简览) | detailed(详细)
  render(){
    if(this.sub==='year'){ this.renderYearPage(); return; }
    if(this.sub==='company'){ this.renderCompanyPage(); return; }
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="search-box">
        <div class="search-input-wrap">
          <input id="projSearch" placeholder="搜索公司全称 / 项目名称..." value="${this.search}" oninput="Projects.onSearchInput()" onkeydown="if(event.key==='Enter')Projects.onSearchInput()">
          <button class="search-clear" id="projSearchClear" onclick="Projects.clearSearch()" style="display:${this.search?'flex':'none'}">✕</button>
        </div>
      </div>
      <div id="matchBanner"></div>
      <div class="filter-bar">
        ${this.multiSelect
          ? `<div class="filter-chip" onclick="Projects.exitMultiSelect()">✕ 取消</div>
             <div class="filter-chip active">多选删除模式</div>`
          : `<div class="filter-chip active">全部项目 (${this.totalCount()})</div>
             <div class="filter-chip" style="margin-left:auto" onclick="Projects.enterMultiSelect()">✎ 多选删除</div>`}
      </div>
      <div id="projectTree"></div>
      <div class="multi-bar ${this.multiSelect?'show':''}">
        <div class="mb-info">已选 <b>${this.selected.size}</b> 项</div>
        <div class="mb-actions">
          <button class="btn-save ${this.selected.size?'':'disabled'}" onclick="Projects.deleteSelected()">🗑 删除</button>
        </div>
      </div>
    `;
    this.renderTree();
  },
  totalCount(){
    return Store.data.projects.reduce((s,p)=>s+p.items.length,0);
  },
  /* 检索范围：公司全称 / 项目名称。公司名命中则展示该公司全部项目；仅项目名命中则仅展示命中项目 */
  filterGroups(kw){
    kw = (kw||'').trim().toLowerCase();
    if(!kw) return Store.data.projects.map(p=>({p, items:p.items, compMatch:false}));
    return Store.data.projects.map(p=>{
      const compMatch = p.company.toLowerCase().includes(kw);
      const hitItems = p.items.filter(it=>it.name.toLowerCase().includes(kw));
      if(compMatch) return {p, items:p.items, compMatch:true};
      if(hitItems.length) return {p, items:hitItems, compMatch:false};
      return null;
    }).filter(Boolean);
  },
  renderTree(){
    const el = document.getElementById('projectTree');
    if(!el) return;
    const banner = document.getElementById('matchBanner');
    const kw = (this.search||'').trim().toLowerCase();
    const groups = this.filterGroups(this.search);
    const totalItems = groups.reduce((s,g)=>s+g.items.length,0);
    if(banner){
      banner.innerHTML = (kw && groups.length)
        ? `<div class="match-banner">🔍 命中 <b>${groups.length}</b> 个公司分组、<b>${totalItems}</b> 个项目<span class="mb-reset" onclick="Projects.clearSearch()">✕ 清除搜索</span></div>`
        : '';
    }
    if(!Store.data.projects.length){
      el.innerHTML = '<div class="empty-state"><div class="icon">📁</div><div class="text">暂无公司项目<br>点击右下角+添加</div></div>';
      return;
    }
    if(kw && !groups.length){
      el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div class="text">未找到匹配的公司或项目</div></div>';
      return;
    }
    // 按年份聚合（年份从 item.listTime 派生）
    const itemYear=(it)=> it.listTime ? String(it.listTime).slice(0,4) : '';
    const yearMap=new Map();
    groups.forEach(g=>{
      const byYear=new Map();
      g.items.forEach(it=>{ const y=itemYear(it)||'未知'; if(!byYear.has(y)) byYear.set(y,[]); byYear.get(y).push(it); });
      byYear.forEach((its,y)=>{ if(!yearMap.has(y)) yearMap.set(y,[]); yearMap.get(y).push({p:g.p, items:its}); });
    });
    const years=[...yearMap.keys()].sort((a,b)=>{ if(a==='未知') return 1; if(b==='未知') return -1; return b-a; });
    el.innerHTML = years.map((y,yi)=>{
      const comps=yearMap.get(y);
      const yearCount=comps.reduce((s,c)=>s+c.items.length,0);
      return `
        <div class="tree-item level-1 ${kw||yi===0?'open':''}" id="projyear_${y}">
          <div class="tree-head" onclick="Projects.goYearPage('${y}')">
            <div class="arrow" onclick="Projects.toggleYear('${y}');event.stopPropagation()">${getIcon('chevron')}</div>

            <div class="count">${yearCount}</div>

          <div class="tree-children">
            ${comps.map((c,ci)=>this.companyNodeHTML(c.p,c.items,kw,y,ci===0)).join('')}
          </div>
        </div>
      `;
    }).join('');
    if(this.multiSelect){
      el.querySelectorAll('.parent-check').forEach(cb=>{
        const cid=cb.dataset.cid;
        const items=[...el.querySelectorAll('.item-check[data-cid="'+cid+'"]')];
        const sel=items.filter(i=>i.checked).length;
        cb.indeterminate = sel>0 && sel<items.length;
      });
    }
  },

  escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); },

  onSearchInput(){

  /* ===== 多选删除模式 ===== */
  enterMultiSelect(){
    this.multiSelect=true; this.selected=new Set();
    this.render();
  },
  exitMultiSelect(){
    this.multiSelect=false; this.selected=new Set();
    this.render();
  },
  // 勾选父分组：自动全选 / 取消全选其下全部子项目
  toggleCompany(companyId,checked){
    if(checked){ this.selected.add('C:'+companyId); }
    else { this.selected.delete('C:'+companyId); }
    const comp=Store.data.projects.find(p=>p.id===companyId);
    if(comp){ comp.items.forEach(it=>{ const k='I:'+companyId+':'+it.id; if(checked) this.selected.add(k); else this.selected.delete(k); }); }
    this.renderTree(); this.updateMultiBar();
  },
  // 勾选单条项目：同步父分组勾选态
  toggleItem(companyId,itemId,checked){
    const k='I:'+companyId+':'+itemId;
    if(checked) this.selected.add(k); else this.selected.delete(k);
    const comp=Store.data.projects.find(p=>p.id===companyId);
    if(comp){
      const all=comp.items.every(it=>this.selected.has('I:'+companyId+':'+it.id));
      const any=comp.items.some(it=>this.selected.has('I:'+companyId+':'+it.id));
      if(all && comp.items.length) this.selected.add('C:'+companyId);
      else this.selected.delete('C:'+companyId);
      // 仅部分选中时标记父级 indeterminate（在 renderTree 中处理）
      void any;
    }
    this.renderTree(); this.updateMultiBar();
  },
  updateMultiBar(){
    const bar=document.querySelector('.multi-bar');
    if(!bar) return;
    bar.classList.toggle('show',this.multiSelect);
    const info=bar.querySelector('.mb-info b'); if(info) info.textContent=this.selected.size;
    const btn=bar.querySelector('.btn-save'); if(btn) btn.classList.toggle('disabled',!this.selected.size);
  },
  // 批量删除（软删除至回收站）：整组令牌优先，单条令牌仅删选中单条
  deleteSelected(){
    if(!this.selected.size){ toast('请先勾选要删除的数据'); return; }
    const companies=new Set(), items=[];
    this.selected.forEach(tok=>{
      if(tok.startsWith('C:')) companies.add(tok.slice(2));
      else if(tok.startsWith('I:')){ const [cid,iid]=tok.slice(2).split(':'); items.push({cid,iid}); }
    });
    const compCount=companies.size, itemCount=items.length;
    Confirm.show({ title:'确认删除', message:`将把选中的 ${companies.size} 个公司分组、${items.length} 条项目移入回收站，可在回收站复原。确定继续？`, confirmText:'移入回收站', onConfirm:()=>{
      // 整组删除
      companies.forEach(cid=>{
        const idx=Store.data.projects.findIndex(p=>p.id===cid);
        if(idx>=0){ const comp=Store.data.projects[idx]; Bin.push({type:'project', originGroup:comp.company, wholeGroup:true, count:comp.items.length, data:comp}); Store.data.projects.splice(idx,1); }
      });
      // 单条删除（排除已整组删除的公司）
      items.forEach(({cid,iid})=>{
        if(companies.has(cid)) return;
        const comp=Store.data.projects.find(p=>p.id===cid);
        if(!comp) return;
        const it=comp.items.find(i=>i.id===iid);
        if(!it) return;
        Bin.push({type:'project', originGroup:comp.company, wholeGroup:false, count:1, data:it, originKey:{companyId:cid, companyName:comp.company}});
        comp.items=comp.items.filter(i=>i.id!==iid);
      });
      Store.pruneEmptyCompanies();
      Store.save();
      this.exitMultiSelect();
      toast(`已移入回收站（${compCount} 组 / ${itemCount} 条）`);
    }});
  },
  // 卡片级删除 → 软删除至回收站（保留单条，父分组不删）
  delItem(companyId,itemId){
    const comp=Store.data.projects.find(p=>p.id===companyId);
    const item=comp?.items.find(i=>i.id===itemId);
    if(!item) return;
    Confirm.show({ title:'删除项目', message:`确定将项目「${item.name}」移入回收站吗？`, confirmText:'移入回收站', onConfirm:()=>{
      Bin.push({type:'project', originGroup:comp.company, wholeGroup:false, count:1, data:item, originKey:{companyId, companyName:comp.company}});
      comp.items=comp.items.filter(i=>i.id!==itemId);
      Store.pruneEmptyCompanies();
      Store.save(); rerenderActive(); toast('已移入回收站');
    }});
  },
  // 编辑弹窗内删除 → 软删除至回收站
  delFromEdit(companyId,itemId){
    const comp=Store.data.projects.find(p=>p.id===companyId);
    const item=comp?.items.find(i=>i.id===itemId);
    if(!item) return;
    Confirm.show({ title:'删除项目', message:`确定将项目「${item.name}」移入回收站吗？（仅删除本条，保留所属公司）`, confirmText:'移入回收站', onConfirm:()=>{

      comp.items=comp.items.filter(i=>i.id!==itemId);
      Store.pruneEmptyCompanies();

    const y=this.subYear;
    let companies=Store.data.projects
      .map(p=>({p, items:p.items.filter(it=>{ const iy=it.listTime?String(it.listTime).slice(0,4):''; return iy===String(y); })}))
      .filter(x=>x.items.length);

      companies=companies.map(x=>({p:x.p, items:x.items.filter(it=> (it.buyer&&it.buyer.toLowerCase().includes(kw)) || it.name.toLowerCase().includes(kw))})).filter(x=>x.items.length);

  exportYearProjects(){
    const y=this.subYear;
    const statusMap={prep:'筹备中',listing:'挂牌中',bidding:'竞价中',done:'已结束'};
    const rows=[['公司','项目名称','挂牌时间','竞价时间','挂牌价','成交价','购买人','联系人','项目状态','备注']];
    Store.data.projects.forEach(p=>p.items.forEach(it=>{
      const iy=it.listTime?String(it.listTime).slice(0,4):'';
      if(iy===String(y)) rows.push([p.company, it.name||'', it.listTime||'', it.bidTime||'', it.listPrice||'', it.dealPrice||'', it.buyer||'', it.contact||'', statusMap[it.status]||it.status||'', it.notes||'']);
    }));
    const csv='\uFEFF'+rows.map(r=>r.map(this.csvCell).join(',')).join('\r\n');
    this.downloadCSV(csv, y+'年全部项目.csv');
    toast('已开始导出该年份项目');
  },
  csvCell(v){
    const s=String(v==null?'':v);
    return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  },
  downloadCSV(csv, filename){
    try{
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){ toast('导出失败：'+(e&&e.message?e.message:e)); }
  },

/* ============ 价格精度 / 金额解析 通用工具 ============ */
// 按精度格式化金额：prec='fen' 保留 2 位小数；prec='yuan' 四舍五入取整（无小数）
function priceFmtPrec(y, prec){
  if(y==null||isNaN(y)) return '';
  if(prec==='yuan') return String(Math.round(y));
  return Number(y.toFixed(2)).toFixed(2);
}
// 解析案件价格文本（支持 万/亿 后缀、千分位、纯数字）→ 元
function parseMoneyYuan(t){
  if(t==null) return NaN;
  t=String(t).trim().replace(/,/g,'');
  if(!t) return NaN;
  var v=parseFloat(t.replace(/[^\d.]/g,''));
  if(isNaN(v)) return NaN;
  if(/亿/.test(t)) v*=1e8;
  else if(/万/.test(t)) v*=1e4;
  return v;
}
// 上拍网站展示文案：淘宝/京东/其他：自定义；空→未填写
function auctionPlatformLabel(cs){
  if(!cs) return '未填写';
  var p=cs.auctionPlatform;
  if(!p) return '未填写';
  if(p==='其他') return '其他：'+(cs.auctionPlatformOther||'');
  return p;
}

  toggleDropdown(which){
    const overlay=document.getElementById('cfOverlay');
    const ids=['judgeDropdown','courtDropdown','yearDropdown','monthDropdown'];
    const target=document.getElementById(which+'Dropdown');
    if(!target) return;
    const trigger = target.querySelector('.cf-trigger');
    const panel = target.querySelector('.cf-panel');
    if(!trigger || !panel) return;
    const willOpen = !panel.classList.contains('show');
    // 关闭全部下拉
    ids.forEach(id=>{
      const el=document.getElementById(id);
      if(!el) return;
      const p=el.querySelector('.cf-panel');
      if(p){ p.classList.remove('show'); p.style.top=''; p.style.left=''; p.style.width=''; }
      el.classList.remove('open');
    });
    if(!willOpen){ if(overlay) overlay.classList.remove('show'); return; }
    // 按 trigger 实时坐标定位 panel（position:fixed），确保盖在所有内容上方
    const rect = trigger.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const pad = 8;
    // 左对齐于 trigger，靠近右边界时贴右
    let left = rect.left;
    if(left + rect.width > vw - pad) left = Math.max(pad, vw - rect.width - pad);
    panel.style.position = 'fixed';
    panel.style.left = left + 'px';
    panel.style.width = rect.width + 'px';
    // 先固定 top 供浏览器计算真实高度
    panel.style.top = (rect.bottom + 6) + 'px';
    requestAnimationFrame(()=>{
      const ph = panel.scrollHeight;
      const maxH = Math.min(vh*0.6, 360);
      const realH = Math.min(ph, maxH);
      const spaceBelow = vh - rect.bottom - pad;
      let top;
      if(spaceBelow >= realH){
        top = rect.bottom + 6;                        // 下方空间充足 → 向下展开
      } else if(rect.top - pad >= realH){
        top = rect.top - 6 - realH;                   // 下方不足且上方充足 → 向上弹出
      } else {
        top = Math.max(pad, vh - pad - realH);        // 上下都不够 → 贴底展开并允许内部滚动
      }
      panel.style.top = top + 'px';
      // 当前选中项滚到中央（更明显）
      const active = panel.querySelector('.cf-option.active');
      if(active && active.scrollIntoView) active.scrollIntoView({block:'center'});
    });
    target.classList.add('open');
    panel.classList.add('show');
    if(overlay) overlay.classList.add('show');
  },

      ['上拍网站',auctionPlatformLabel(cs)],
      ['二拍价格',cs.secondAuctionPrice||'-'],

        </div>

          ${fields.filter(f=>f[1]).map(f=>`<div class="cd-field"><span class="k">${f[0]}：</span><span class="v">${f[1]}</span></div>`).join('')}
        </div>
        ${cs.notes?`<div class="pc-notes" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--divider)">备注：${cs.notes}</div>`:''}

  // 拍卖周期是否结束（用于结案填报）
  auctionEnded(cs){
    if(cs.status==='已结束'||cs.archived) return true;
    const dt=cs.stage==='一拍'?cs.firstAuctionTime:(cs.secondAuctionTime||cs.firstAuctionTime);
    if(!dt) return false;
    return daysUntil(dt)<0;
  },
  // 结案填报卡片
  closingBox(cs){
    if(!this.auctionEnded(cs)) return '';
    if(cs.closing && cs.closing.filled){
      const c=cs.closing;
      return `<div class="closing-box">
        <div class="cb-title">✅ 结案已填报</div>
        <div style="font-size:11px;color:var(--text-sub)">
          ${c.type==='unsold' ? '成交结果：流拍 · 移交流拍报告 '+(c.reportDate||'-') : '成交结果：'+this.closingTypeLabel(c.type)+' · 成交金额 '+(c.amount||'-')}
        </div>
        ${cs.archived?'<div class="closing-done">📦 已自动归档结案</div>':''}
      </div>`;
    }
    return `<div class="closing-box">
      <div class="cb-title">📋 拍卖周期已结束 · 请填报结案</div>
      <div class="cb-row">
        <select id="cl_type_${cs.id}" onchange="Cases.updateClosingPlaceholder('${cs.id}')">
          <option value="yp_sold">一拍成交</option>
          <option value="ep_sold">二拍成交</option>
          <option value="bm_sold">变卖成交</option>
          <option value="unsold">流拍（未成交）</option>
        </select>
      </div>
      <div class="cb-row">
        <input id="cl_val_${cs.id}" placeholder="成交金额(如:5600万)">
      </div>
      <div class="cb-save" onclick="Cases.submitClosing('${cs.id}')">提交结案填报</div>
    </div>`;
  },
  closingTypeLabel(type){
    return {'yp_sold':'一拍成交','ep_sold':'二拍成交','bm_sold':'变卖成交'}[type]||'已成交';
  },
  updateClosingPlaceholder(id){
    const sel=document.getElementById('cl_type_'+id);
    const inp=document.getElementById('cl_val_'+id);
    if(sel && inp){ inp.placeholder = sel.value==='sold' ? '成交金额(如:5600万)' : '移交流拍报告日期(如:2026-08-01)'; }
  },
  submitClosing(id){
    const cs=Store.data.cases.find(c=>c.id===id);
    if(!cs) return;
    const type=document.getElementById('cl_type_'+id).value;
    const val=document.getElementById('cl_val_'+id).value.trim();
    if(!val){ toast('请填写金额或日期'); return; }
    cs.closing={filled:true, type, amount:type!=='unsold'?val:'', reportDate:type==='unsold'?val:''};
    cs.status='已结束';
    if(type!=='unsold') cs.dealPrice=val;
    // 变卖阶段填报完成 → 自动归档结案；其他阶段填报后按已完结处理
    cs.archived=true;
    Store.save();
    this.render();
    Cases.syncWarnings();
    toast('结案填报已提交');
  },
  remindToggle(id){
    const cs=Store.data.cases.find(c=>c.id===id);
    if(!cs) return;
    cs.remindStatus = cs.remindStatus==='done' ? 'pending' : 'done';
    Store.save();
    this.render();
    Cases.syncWarnings();
    this.expand(id);
    toast(cs.remindStatus==='done'?'已标记为已提醒，预警已解除':'已恢复为未完成');
  },
  checkWarning(cs){
    if(cs.status==='已结束') return false;
    if(cs.archived) return false;
    if(cs.remindStatus==='done') return false;
    if(cs.closing && cs.closing.filled) return false;
    const dt=cs.stage==='一拍'?cs.firstAuctionTime:(cs.secondAuctionTime||cs.firstAuctionTime);
    if(!dt) return false;
    const days=daysUntil(dt);
    // 拍卖结束后第三周内预警（使用精确的第三周计算）
    if(isInThirdWeek(dt)) return true;
    // 拍卖即将开始30天内预警
    if(days>=0 && days<=30) return true;
    // 拍卖结束后21天内预警（宽泛预警，覆盖第三周前后）
    if(days<0 && days>=-21) return true;
    return false;
  },

  syncWarnings(){
    // 同步法拍预警到备忘录
    const existingWarn=Store.data.todos.filter(t=>t.source==='auction');
    existingWarn.forEach(t=>{ if(!Store.data.cases.find(c=>c.id===t.caseId)){ Store.data.todos=Store.data.todos.filter(x=>x.id!==t.id); }});
    // 移除已提醒 / 已结案填报 / 已归档案件的预警待办
    Store.data.todos=Store.data.todos.filter(t=>{
      if(t.source!=='auction') return true;
      const cs=Store.data.cases.find(c=>c.id===t.caseId);
      if(!cs) return true;
      if(cs.remindStatus==='done' || (cs.closing&&cs.closing.filled) || cs.archived) return false;
      return true;
    });
    Store.data.cases.forEach(cs=>{
      if(cs.status==='已结束' || cs.archived || cs.remindStatus==='done' || (cs.closing&&cs.closing.filled)) return;
      const dt=cs.stage==='一拍'?cs.firstAuctionTime:(cs.secondAuctionTime||cs.firstAuctionTime);
      if(!dt) return;
      // 使用第三周关键节点精确判断
      if(isInThirdWeek(dt)){
        const existing=Store.data.todos.find(t=>t.caseId===cs.id && t.source==='auction');
        if(!existing){
          const w=getThirdWeekDays(dt);
          Store.data.todos.push({
            id:uid('tw'), title:`【预警】${cs.name} 第三周关键节点 ${fmtDate(w.start)}-${fmtDate(w.end)}`,
            date:Store.dateStr(0), time:'', priority:'high', done:false,
            source:'auction', caseId:cs.id
          });
        }
      }
    });
    Store.save();
  }
};

/* ============ 回收站 ============
   统一入口：分页签（公司项目 / 法拍案件）、多选、复原、永久删除、一键清空。
   所有删除行为软删除至回收站，此处负责复原 / 永久销毁，规则全场景统一。 */
const Recycle = {
  tab:'project',            // project | case
  selected:{},              // binId -> true
  render(){
    const c=document.getElementById('content');
    const isP=this.tab==='project';
    const all=Bin.list(this.tab);
    const selIds=Object.keys(this.selected).filter(id=>this.selected[id]);
    const selCount=selIds.length;
    c.innerHTML=`
      <div class="page-title"><span class="pt-emoji">${getIcon('trash')}</span>回收站</div>
      <div class="recycle-tabs">
        <div class="rc-tab ${isP?'active':''}" onclick="Recycle.setTab('project')">🏢 公司项目 (${Bin.list('project').length})</div>
        <div class="rc-tab ${!isP?'active':''}" onclick="Recycle.setTab('case')">⚖️ 法拍案件 (${Bin.list('case').length})</div>
      </div>
      ${all.length?`<div class="rb-action-top">
          <label class="rb-selall"><input type="checkbox" class="rb-check" ${selCount===all.length?'checked':''} onchange="Recycle.toggleAll(this.checked)"> 全选本页</label>
          <div class="rb-clear" onclick="Recycle.confirmClearAll()">🗑 一键清空回收站</div>
        </div>`:''}
      <div id="recycleList">${all.length?'':'<div class="empty-state"><div class="icon">🗑️</div><div class="text">回收站为空<br>删除的数据会暂存于此，可复原</div></div>'}</div>
      <div class="multi-bar ${all.length?'show':''}">
        <div class="mb-info">已选 <b>${selCount}</b> 项</div>
        <div class="mb-actions">
          <button class="btn-save ${selCount?'':'disabled'}" onclick="Recycle.confirmRestore()">♻️ 复原</button>
          <button class="btn-danger ${selCount?'':'disabled'}" onclick="Recycle.confirmPurge()">🗑 永久删除</button>
        </div>
      </div>
    `;
    const list=document.getElementById('recycleList');
    if(!all.length) return;
    list.innerHTML=all.map(r=>{
      const name = r.type==='project' ? (r.wholeGroup? r.data.company : r.data.name) : r.data.name;
      return `
        <div class="rb-item ${this.selected[r.binId]?'sel':''}">
          <input type="checkbox" class="rb-check" ${this.selected[r.binId]?'checked':''} onchange="Recycle.toggleSel('${r.binId}',this.checked)">
          <div class="rb-main">
            <div class="rb-name">${name}${r.wholeGroup&&r.type==='project'?` <span class="rb-tag">整组 · ${r.count} 项</span>`:''}</div>
            <div class="rb-meta">归属：${r.originGroup||'-'} · 删除于 ${fmtDateTime(r.deletedAt)}</div>
          </div>
          <div class="rb-ops">
            <span class="rb-op" onclick="Recycle.restoreOne('${r.binId}')">复原</span>
            <span class="rb-op del" onclick="Recycle.confirmPurgeOne('${r.binId}')">永久删除</span>
          </div>
        </div>`;
    }).join('');
  },
  setTab(t){ this.tab=t; this.selected={}; this.render(); },
  toggleSel(id,checked){ if(checked) this.selected[id]=true; else delete this.selected[id]; this.render(); },
  toggleAll(checked){ const all=Bin.list(this.tab); if(checked){ all.forEach(r=>this.selected[r.binId]=true); } else { this.selected={}; } this.render(); },
  _ids(){ return Object.keys(this.selected).filter(id=>this.selected[id]); },
  afterCaseChange(){ if(this.tab==='case' && Cases.syncWarnings) Cases.syncWarnings(); },
  restoreOne(id){
    Confirm.show({ title:'复原此条', message:'确定将这条数据恢复至原始所属分组吗？', confirmText:'复原', onConfirm:()=>{
      Bin.restore(id); this.render(); this.afterCaseChange(); toast('已复原至原始分组');
    }});
  },
  confirmPurgeOne(id){
    Confirm.show({ title:'永久删除', message:'此操作不可恢复，确定永久删除这条数据吗？', confirmText:'永久删除', danger:true, onConfirm:()=>{
      Confirm.show({ title:'再次确认', message:'高危操作：永久删除后无法复原，确认继续？', confirmText:'确认永久删除', danger:true, onConfirm:()=>{
        Bin.purge(id); this.render(); toast('已永久删除');
      }});
    }});
  },
  confirmRestore(){
    const ids=this._ids(); if(!ids.length) return;
    Confirm.show({ title:'批量复原', message:`确定将选中的 ${ids.length} 条数据恢复至原始所属分组吗？`, confirmText:'复原', onConfirm:()=>{
      ids.forEach(id=>Bin.restore(id)); this.selected={}; this.render(); this.afterCaseChange(); toast('已复原选中数据');
    }});
  },
  confirmPurge(){
    const ids=this._ids(); if(!ids.length) return;
    Confirm.show({ title:'批量永久删除', message:`此操作不可恢复，确定永久删除选中的 ${ids.length} 条数据吗？`, confirmText:'永久删除', danger:true, onConfirm:()=>{
      Confirm.show({ title:'再次确认', message:'高危操作：永久删除后无法复原，确认继续？', confirmText:'确认永久删除', danger:true, onConfirm:()=>{
        ids.forEach(id=>Bin.purge(id)); this.selected={}; this.render(); toast('已永久删除选中数据');
      }});
    }});
  },
  confirmClearAll(){
    Confirm.show({ title:'清空回收站', message:'将永久删除回收站内全部数据，此操作不可恢复。', confirmText:'清空全部', danger:true, onConfirm:()=>{
      Confirm.show({ title:'再次确认', message:'高危操作：清空后所有数据无法复原，确认继续？', confirmText:'确认清空', danger:true, onConfirm:()=>{
        Bin.clearAll(); this.selected={}; this.render(); toast('回收站已清空');
      }});
    }});
  }
};

/* ============ 全局检索 ============ */
const Search = {
  domain:'company',                 // company | court
  keyword:'',
  courtJudge:'', courtFilter:'', courtView:'brief',
  filterYear:'',                // 检索：年份筛选（''=全部，公司与法院方向共用）
  filterCourt:'',               // 法拍案件检索：法院筛选（''=全部）
  filterStage:'',               // 法拍案件检索：阶段筛选（''=全部 / 一拍 / 二拍 / 变卖）
  filterCompany:'',             // 公司项目检索：公司筛选（''=全部）
  filterCStage:'',              // 公司项目检索：阶段筛选（''=全部 / listing / bidding / done）
  companyExpanded:false,        // 「全部公司」标签栏展开状态
  courtExpanded:false,          // 「全部法院」标签栏展开状态
  _railHandler:null,            // 标签栏外部点击收起监听
  _sugs:[], _sugActive:-1,
  // 进入页面即清空（Nav.go 调用），恢复全量数据
  resetSearch(){
    this.keyword=''; this.courtJudge=''; this.courtFilter='';
    this.filterYear=''; this.filterCourt=''; this.filterStage='';
    this.filterCompany=''; this.filterCStage='';
    this.companyExpanded=false; this.courtExpanded=false;
    this.collapseRails();
  },
  /* 筛选标签栏展开/收回（全部公司 / 全部法院） */
  toggleCompanyRail(e){ if(e) e.stopPropagation(); this.companyExpanded=!this.companyExpanded; const bar=document.querySelector('.company-rail'); if(bar) bar.classList.toggle('expanded',this.companyExpanded); this.syncRailClose(); },
  toggleCourtRail(e){ if(e) e.stopPropagation(); this.courtExpanded=!this.courtExpanded; const bar=document.querySelector('.court-rail'); if(bar) bar.classList.toggle('expanded',this.courtExpanded); this.syncRailClose(); },
  syncRailClose(){
    if(this.companyExpanded||this.courtExpanded){
      if(!this._railHandler){
        this._railHandler=(ev)=>{ if(!ev.target.closest('.collapsible')) this.collapseRails(); };
        setTimeout(()=>document.addEventListener('click',this._railHandler),0);
      }
    } else { this.collapseRails(); }
  },
  collapseRails(){
    this.companyExpanded=false; this.courtExpanded=false;
    const els=document.querySelectorAll('.collapsible.expanded');
    for(let i=0;i<els.length;i++) els[i].classList.remove('expanded');
    if(this._railHandler){ document.removeEventListener('click',this._railHandler); this._railHandler=null; }
  },
  escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); },
  // JS 单引号字符串字面量转义（用于 onclick 传入中文法院名）
  escapeJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); },
  hl(text,kw){
    const t=text==null?'':String(text);
    const k=(kw||'').trim();
    if(!k) return t;
    const reg=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return t.replace(reg,'<span class="sr-highlight">$1</span>');
  },
  render(){
    const c=document.getElementById('content');
    const isCompany=this.domain==='company';
    c.innerHTML=`
      <div class="domain-toggle">
        <div class="dt-item ${isCompany?'active':''}" onclick="Search.setDomain('company')">
          <span class="dt-ico">🏢</span>公司项目
        </div>
        <div class="dt-item ${!isCompany?'active':''}" onclick="Search.setDomain('court')">
          <span class="dt-ico">⚖️</span>法院案件
        </div>
      </div>

      <div class="search-box">
        <div class="search-input-wrap">
          <input id="searchInput"
            placeholder="${isCompany?'搜索公司名称、项目名称、购买人…':'搜索：法院 / 年份 / 月份 / 承租人 / 标的物地址 / 一拍二拍'}"
            value="${this.escapeAttr(this.keyword)}" autocomplete="off"
            oninput="Search.onInput()" onfocus="Search.onInput()"
            onkeydown="Search.onKey(event)" onblur="Search.onBlur()">
          <button class="search-clear" id="searchClear" onclick="Search.clearSearch()" style="display:${this.keyword?'flex':'none'}">✕</button>
          <div class="suggest-dropdown" id="suggestDropdown"></div>
        </div>
        <button class="btn-search" onclick="Search.runSearch()">${getIcon('search')}</button>
      </div>

      ${isCompany ? this.companyControlsHTML() : this.courtControlsHTML()}

      <div id="searchResults"></div>
    `;
    this.renderResults();
    const inp=document.getElementById('searchInput');
    if(inp) inp.value=this.keyword;
  },
  /* ===== 域名切换 ===== */
  setDomain(d){
    if(this.domain===d) return;
    this.domain=d;
    this.resetSearch();
    this.render();
  },
  /* ===== 实时联想下拉 ===== */
  onInput(){
    const inp=document.getElementById('searchInput');
    if(!inp) return;
    this.keyword=inp.value;
    const cb=document.getElementById('searchClear');
    if(cb) cb.style.display=this.keyword.trim()?'flex':'none';
    if(!this.keyword.trim()){
      const d=document.getElementById('suggestDropdown');
      if(d){ d.classList.remove('show'); d.innerHTML=''; }
      this._sugs=[]; this._sugActive=-1;
      this.renderResults();           // 清空关键词 → 恢复全部
      return;
    }
    this.renderSuggest();
  },
  onBlur(){
    setTimeout(()=>{
      const d=document.getElementById('suggestDropdown');
      if(d) d.classList.remove('show');
      this._sugActive=-1;
    },200);
  },
  onKey(e){
    const d=document.getElementById('suggestDropdown');
    const open = d && d.classList.contains('show') && this._sugs.length;
    if(e.key==='ArrowDown' && open){
      e.preventDefault();
      this._sugActive=Math.min(this._sugs.length-1, this._sugActive+1);
      this.updateSugActive(); return;
    }
    if(e.key==='ArrowUp' && open){
      e.preventDefault();
      this._sugActive=this._sugActive<=0 ? this._sugs.length-1 : this._sugActive-1;
      this.updateSugActive(); return;
    }
    if(e.key==='Enter'){
      if(open && this._sugActive>=0) this.pickSuggestionFromList(this._sugActive);
      else this.runSearch();
      return;
    }
    if(e.key==='Escape'){ if(d) d.classList.remove('show'); }
  },
  updateSugActive(){
    const d=document.getElementById('suggestDropdown');
    if(!d) return;
    d.querySelectorAll('.suggest-item').forEach((el,i)=>el.classList.toggle('active', i===this._sugActive));
  },
  buildSuggestions(kw){
    const out=[]; const seen=new Set();
    const push=(type,tag,tagClass,value)=>{
      if(!value) return;
      const v=String(value).trim();
      if(!v.toLowerCase().includes(kw)) return;
      const key=type+'|'+v;
      if(seen.has(key)) return; seen.add(key);
      out.push({type,tag,tagClass,value:v,display:this.hl(v,kw)});
    };
    if(this.domain==='company'){
      Store.data.projects.forEach(p=>{
        push('company','公司','t-company',p.company);
        p.items.forEach(it=>{
          push('project','项目','t-project',it.name);
          if(it.buyer) push('buyer','购买人','t-buyer',it.buyer);
        });
      });
    } else {
      const judges=new Set();
      Store.data.cases.forEach(cs=>{
        push('court','法院','t-court',cs.court);
        const j=cs.responsibleJudge||cs.judge; if(j) judges.add(j);
        push('applicant','申请人','t-applicant',cs.applicant);
        push('case','项目','t-case',cs.name);
      });
      judges.forEach(j=>push('judge','法官','t-judge',j));
    }
    out.sort((a,b)=>{
      const ia=a.value.toLowerCase().indexOf(kw), ib=b.value.toLowerCase().indexOf(kw);
      if(ia!==ib) return ia-ib;
      return a.value.length-b.value.length;
    });
    return out.slice(0,12);
  },
  renderSuggest(){
    const d=document.getElementById('suggestDropdown');
    if(!d) return;
    const kw=this.keyword.trim().toLowerCase();
    if(!kw){ d.classList.remove('show'); d.innerHTML=''; this._sugs=[]; return; }
    const sugs=this.buildSuggestions(kw);
    this._sugs=sugs; this._sugActive=-1;
    if(!sugs.length){
      d.innerHTML='<div class="suggest-empty">无匹配候选，回车将按关键词筛选</div>';
      d.classList.add('show'); return;
    }
    d.innerHTML='<div class="suggest-hint">实时联想 · 点击回填并筛选</div>'+
      sugs.map((s,i)=>`
        <div class="suggest-item" data-i="${i}" onmousedown="Search.pickSuggestionFromList(${i})">
          <span class="suggest-tag ${s.tagClass}">${s.tag}</span>
          <span class="suggest-val">${s.display}</span>
        </div>`).join('');
    d.classList.add('show');
  },
  pickSuggestionFromList(i){
    const s=this._sugs[i];
    if(s) this.pickSuggestion(s.value);
  },
  pickSuggestion(value){
    this.keyword=value;
    const inp=document.getElementById('searchInput');
    if(inp) inp.value=value;
    const d=document.getElementById('suggestDropdown');
    if(d){ d.classList.remove('show'); d.innerHTML=''; }
    this.runSearch();
  },
  runSearch(){
    const d=document.getElementById('suggestDropdown');
    if(d) d.classList.remove('show');
    this.renderResults();
  },
  clearSearch(){
    this.resetSearch();
    this.render();
  },
  /* ===== 法院方向：顶部横向控件（简览/详情 + 法官 + 法院） ===== */
  courtControlsHTML(){
    // 年份列表：始终展示所有有案件的年份（降序）
    const allYears=[...new Set(Store.data.cases.map(cs=>cs.year))].sort((a,b)=>b-a);
    // 法院列表：根据当前筛选的年份动态调整（选了年份后只显示该年有的法院）
    let courtPool=Store.data.cases;
    if(this.filterYear) courtPool=courtPool.filter(cs=>String(cs.year)===String(this.filterYear));
    const allCourts=Store.caseCourts();
    const isFiltered=!!(this.courtJudge||this.courtFilter||this.filterYear||this.filterCourt||this.filterStage||this.keyword.trim());
    return `
      <div class="view-toggle-bar">
        <div class="view-toggle">
          <button class="${this.courtView==='brief'?'active':''}" onclick="Search.setCourtView('brief')">简览</button>
          <button class="${this.courtView==='detailed'?'active':''}" onclick="Search.setCourtView('detailed')">详细</button>
        </div>
        ${isFiltered?'<div class="filter-clear" onclick="Search.clearCourtFilters()">✕ 清除筛选</div>':''}
      </div>
      <div class="court-filter-panel">
        <div class="stage-bar">
          <div class="stage-chip ${!this.filterYear?'active':''}" onclick="Search.setFilterYear('')">全部年份</div>
          ${allYears.map(y=>`<div class="stage-chip ${String(this.filterYear)===String(y)?'active':''}" onclick="Search.setFilterYear('${y}')">${y}年</div>`).join('')}
        </div>
        <div class="stage-bar collapsible court-rail ${this.courtExpanded?'expanded':''}">
          <div class="stage-chip base-toggle ${!this.filterCourt?'active':''}" onclick="Search.toggleCourtRail(event)">全部法院${this.courtExpanded?'':' ('+allCourts.length+')'}</div>
          <div class="chip-rail">
            ${allCourts.map(ct=>`<div class="stage-chip ${this.filterCourt===ct?'active':''}" onclick="Search.setFilterCourt('${this.escapeJs(ct)}')">${this.escapeAttr(ct)}</div>`).join('')}
          </div>
        </div>
        <div class="stage-bar">
          <div class="stage-chip ${!this.filterStage?'active':''}" onclick="Search.setFilterStage('')">全部阶段</div>
          <div class="stage-chip ${this.filterStage==='一拍'?'active':''}" onclick="Search.setFilterStage('一拍')">一拍</div>
          <div class="stage-chip ${this.filterStage==='二拍'?'active':''}" onclick="Search.setFilterStage('二拍')">二拍</div>
          <div class="stage-chip ${this.filterStage==='变卖'?'active':''}" onclick="Search.setFilterStage('变卖')">变卖</div>
        </div>
      </div>
    `;
  },
  setCourtView(v){ this.courtView=v; this.render(); },
  setFilterYear(y){
    this.filterYear=y;
    if(y && this.filterCompany){
      const itemYear=(it)=> it.listTime ? String(it.listTime).slice(0,4) : '';
      const has=Store.data.projects.some(p=>p.company===this.filterCompany && p.items.some(it=>itemYear(it)===String(y)));
      if(!has) this.filterCompany='';
    }
    this.render();
  },
  setFilterCourt(ct){ this.filterCourt=ct; this.render(); },
  setFilterStage(s){ this.filterStage=s; this.render(); },
  clearCourtFilters(){ this.courtJudge=''; this.courtFilter=''; this.filterYear=''; this.filterCourt=''; this.filterStage=''; this.render(); },
  /* ===== 公司方向：顶部横向筛选（年份 / 公司 / 阶段） ===== */
  companyControlsHTML(){
    const itemYear=(it)=> it.listTime ? String(it.listTime).slice(0,4) : '';
    const allYears=[...new Set(Store.data.projects.flatMap(p=>p.items.map(itemYear).filter(Boolean)))].sort((a,b)=>b-a);
    let projPool=Store.data.projects;
    if(this.filterYear) projPool=projPool.map(p=>({company:p.company, items:p.items.filter(it=>itemYear(it)===String(this.filterYear))})).filter(p=>p.items.length);
    const allCompanies=[...new Set(projPool.filter(p=>p.items&&p.items.length).map(p=>p.company))];
    const isFiltered=!!(this.filterYear||this.filterCompany||this.filterCStage||this.keyword.trim());
    return `
      <div class="court-filter-panel">
        <div class="stage-bar">
          <div class="stage-chip ${!this.filterYear?'active':''}" onclick="Search.setFilterYear('')">全部年份</div>
          ${allYears.map(y=>`<div class="stage-chip ${String(this.filterYear)===String(y)?'active':''}" onclick="Search.setFilterYear('${y}')">${y}年</div>`).join('')}
        </div>
        <div class="stage-bar collapsible company-rail ${this.companyExpanded?'expanded':''}">
          <div class="stage-chip base-toggle ${!this.filterCompany?'active':''}" onclick="Search.toggleCompanyRail(event)">全部公司${this.companyExpanded?'':' ('+allCompanies.length+')'}</div>
          <div class="chip-rail">
            ${allCompanies.map(c=>{
              const esc=this.escapeJs(c);
              return `<div class="stage-chip ${this.filterCompany===c?'active':''}" onclick="Search.setFilterCompany('${esc}')">${this.escapeAttr(c)}</div>`;
            }).join('')}
          </div>
        </div>
        <div class="stage-bar">
          <div class="stage-chip ${!this.filterCStage?'active':''}" onclick="Search.setFilterCStage('')">全部阶段</div>
          <div class="stage-chip ${this.filterCStage==='listing'?'active':''}" onclick="Search.setFilterCStage('listing')">挂牌中</div>
          <div class="stage-chip ${this.filterCStage==='bidding'?'active':''}" onclick="Search.setFilterCStage('bidding')">竞价中</div>
          <div class="stage-chip ${this.filterCStage==='done'?'active':''}" onclick="Search.setFilterCStage('done')">已结束</div>
        </div>
        ${isFiltered?'<div class="filter-clear" onclick="Search.clearCompanyFilters()">✕ 清除筛选</div>':''}
      </div>
    `;
  },
  setFilterCompany(c){ this.filterCompany=c; this.render(); },
  setFilterCStage(s){ this.filterCStage=s; this.render(); },
  clearCompanyFilters(){ this.filterYear=''; this.filterCompany=''; this.filterCStage=''; this.render(); },
  /* ===== 结果渲染 ===== */
  renderResults(){
    const el=document.getElementById('searchResults');
    if(!el) return;
    if(this.domain==='company') this.renderCompanyResults(el);
    else this.renderCourtResults(el);
  },
  renderCompanyResults(el){
    const kw=this.keyword.trim().toLowerCase();
    const itemYear=(it)=> it.listTime ? String(it.listTime).slice(0,4) : '';
    const groups=[]; let totalItems=0;
    Store.data.projects.forEach(p=>{
      if(this.filterCompany && p.company!==this.filterCompany) return;
      const companyMatch = kw && p.company.toLowerCase().includes(kw);
      let items = p.items;
      if(this.filterYear) items=items.filter(it=>itemYear(it)===String(this.filterYear));
      if(this.filterCStage) items=items.filter(it=>it.status===this.filterCStage);
      if(kw) items=items.filter(it => companyMatch || it.name.toLowerCase().includes(kw) || (it.buyer&&it.buyer.toLowerCase().includes(kw)));
      if(items.length===0) return;
      if(kw && !companyMatch && items.length===0) return;   // 该分组无命中
      groups.push({p,items}); totalItems+=items.length;
    });
    if(!groups.length){
      el.innerHTML='<div class="empty-state"><div class="icon">🏢</div><div class="text">未找到匹配的公司或项目<br>请尝试其他筛选条件</div></div>';
      return;
    }
    const isFiltered=!!(kw||this.filterYear||this.filterCompany||this.filterCStage);
    const banner = isFiltered
      ? `<div class="match-banner">🔍 命中 <b>${groups.length}</b> 个公司分组、<b>${totalItems}</b> 个项目<span class="mb-reset" onclick="Search.clearSearch()">✕ 清除筛选</span></div>`
      : `<div class="filter-bar"><div class="filter-chip active">全部公司项目 (${totalItems})</div></div>`;
    el.innerHTML = banner + groups.map(({p,items},idx)=>`
      <div class="tree-item ${idx===0?'open':''}" id="proj_${p.id}">
        <div class="tree-head" onclick="Projects.toggle('${p.id}')">
          <div class="arrow">${getIcon('chevron')}</div>
          <div class="icon-box">${getIcon('folder')}</div>
          <div class="label">${this.hl(p.company,kw)}</div>
          <div class="count">${items.length}</div>
        </div>
        <div class="tree-children">
          ${items.map(it=>Projects.projectCard(it,p.id)).join('')}
          <div style="text-align:center;padding:8px">
            <button class="filter-chip" onclick="Projects.addProject('${p.id}')">+ 添加项目</button>
          </div>
        </div>
      </div>
    `).join('');
  },
  renderCourtResults(el){
    const kw=this.keyword.trim().toLowerCase();
    let cases=Store.data.cases;
    if(this.courtJudge) cases=cases.filter(cs=>(cs.responsibleJudge||cs.judge)===this.courtJudge);
    if(this.courtFilter) cases=cases.filter(cs=>cs.court===this.courtFilter);
    if(this.filterYear) cases=cases.filter(cs=>String(cs.year)===String(this.filterYear));
    if(this.filterCourt) cases=cases.filter(cs=>cs.court===this.filterCourt);
    if(this.filterStage) cases=cases.filter(cs=>String(cs.stage).indexOf(this.filterStage)===0);
    if(kw){
      cases=cases.filter(cs=>{
        const hay=[cs.court,(cs.responsibleJudge||cs.judge),cs.applicant,cs.name].join(' ').toLowerCase();
        return hay.includes(kw);
      });
    }
    if(!cases.length){
      el.innerHTML='<div class="empty-state"><div class="icon">⚖️</div><div class="text">'+(kw||this.courtJudge||this.courtFilter?'未找到匹配的案件':'暂无法拍案件<br>点击右下角+添加')+'</div></div>';
      return;
    }
    const isFiltered=!!(kw||this.courtJudge||this.courtFilter||this.filterYear||this.filterCourt||this.filterStage);
    const banner = isFiltered
      ? `<div class="match-banner">🔍 命中 <b>${cases.length}</b> 个案件<span class="mb-reset" onclick="Search.clearSearch()">✕ 清除筛选</span></div>`
      : `<div class="filter-bar"><div class="filter-chip active">全部法拍案件 (${cases.length})</div></div>`;
    el.innerHTML = banner + this.courtTreeHTML(cases);
  },
  courtTreeHTML(cases){
    const openOf=()=>'open';   // 命中筛选态强制展开，露出命中节点
    const years=[...new Set(cases.map(cs=>cs.year))].sort((a,b)=>b-a);
    let html='<div class="case-tree" id="caseTree">';
    years.forEach((y)=>{
      const yearCases=cases.filter(cs=>cs.year===y);
      const courts=[...new Set(yearCases.map(cs=>cs.court))];
      html+=`<div class="tree-item level-1 ${openOf()}" id="caseYear_${y}">
        <div class="tree-head" onclick="Cases.toggle('caseYear_${y}')">
          <div class="arrow" onclick="Cases.toggle('caseYear_${y}');event.stopPropagation()">${getIcon('chevron')}</div>
          <div class="icon-box">${getIcon('scale')}</div>
          <div class="label">${y}年</div>
          <div class="count">${yearCases.length}</div>
        </div>
        <div class="tree-children">`;
      courts.forEach((court,ci)=>{
        const courtCases=yearCases.filter(cs=>cs.court===court);
        const months=[...new Set(courtCases.map(cs=>cs.month))].sort();
        html+=`<div class="tree-item level-2 ${openOf()}" id="caseCourt_${y}_${ci}">
          <div class="tree-head" onclick="Cases.toggle('caseCourt_${y}_${ci}')">
            <div class="arrow" onclick="Cases.toggle('caseCourt_${y}_${ci}');event.stopPropagation()">${getIcon('chevron')}</div>
            <div class="icon-box">${getIcon('folder')}</div>
            <div class="label">${this.hl(court,this.keyword.trim())}</div>
            <div class="count">${courtCases.length}</div>
          </div>
          <div class="tree-children level-indent">`;
        months.forEach((m,mi)=>{
          const monthCases=courtCases.filter(cs=>cs.month===m);
          monthCases.sort((a,b)=>(a.archived?1:0)-(b.archived?1:0));
          const stages=[...new Set(monthCases.map(cs=>cs.stage))];
          html+=`<div class="tree-item level-3 ${openOf()}" id="caseMonth_${y}_${ci}_${mi}">
            <div class="tree-head" onclick="Cases.toggle('caseMonth_${y}_${ci}_${mi}')">
              <div class="arrow" onclick="Cases.toggle('caseMonth_${y}_${ci}_${mi}');event.stopPropagation()">${getIcon('chevron')}</div>
              <div class="icon-box">${getIcon('calendar')}</div>
              <div class="label">${m}月</div>
              <div class="count">${monthCases.length}</div>
            </div>
            <div class="tree-children level-indent">`;
          stages.forEach((s,si)=>{
            const stageCases=monthCases.filter(cs=>cs.stage===s);
            html+=`<div class="tree-item level-4 ${openOf()}" id="caseStage_${y}_${ci}_${mi}_${si}">
              <div class="tree-head" onclick="Cases.toggle('caseStage_${y}_${ci}_${mi}_${si}')">
                <div class="arrow" onclick="Cases.toggle('caseStage_${y}_${ci}_${mi}_${si}');event.stopPropagation()">${getIcon('chevron')}</div>
                <div class="icon-box">${getIcon('case')}</div>
                <div class="label">${s}</div>
                <div class="count">${stageCases.length}</div>
              </div>
              <div class="tree-children level-indent">
                ${stageCases.map(cs=>this.courtView==='brief'?this.courtBriefCard(cs):Cases.caseCard(cs)).join('')}
              </div>
            </div>`;
          });
          html+='</div></div>';
        });
        html+='</div></div>';
      });
      html+='</div></div>';
    });
    html+='</div>';
    return html;
  },
  courtBriefCard(cs){
    const warn=Cases.checkWarning(cs);
    const reminded=cs.remindStatus==='done';
    const ongoing=Cases.ONGOING.includes(cs.status);
    const cls=['case-brief-card'];
    if(warn) cls.push('warn');
    if(cs.archived) cls.push('archived');
    if(ongoing) cls.push('ongoing');
    const kw=this.keyword.trim();
    return `
      <div class="${cls.join(' ')}" data-case-id="${cs.id}" onclick="Cases.expand('${cs.id}')">
        <div class="cb-head">
          <div class="cb-name">${this.hl(cs.name,kw)}${cs.archived?'<span class="archived-tag">已归档</span>':''}</div>
          ${Cases.caseStatusTag(cs.status)}
        </div>
        <div class="cb-fields">
          <div class="cb-field"><span class="k">受理法院</span><span class="v">${this.hl(cs.court,kw)}</span></div>
          <div class="cb-field"><span class="k">承办法官</span><span class="v">${this.hl(cs.judge||'-',kw)}</span></div>
          <div class="cb-field"><span class="k">申请人</span><span class="v">${this.hl(cs.applicant||'-',kw)}</span></div>
        </div>
        <div class="cb-foot">
          ${warn?'<div class="cb-warn-tag">⚠ 预警</div>':''}
          <div class="remind-tag ${reminded?'remind-done':'remind-pending'}" onclick="event.stopPropagation();Cases.remindToggle('${cs.id}')">${reminded?'✓ 已提醒':'○ 未完成'}</div>
        </div>
      </div>`;
  }
};

  applyTheme(){
    const s=Store.data.settings;
    const mode = s.mode || 'auto'; // auto | day | night
    const hour = new Date().getHours();
    const isNight = mode==='night' || (mode==='auto' && (hour>=22 || hour<6));

    // 解析图标形态 → 决定 data-icons 基底（business / cute）
    let form = resolveIconForm();
    const base = (form==='line' || form==='pixel') ? 'business' : 'cute';
    // 视觉风格分级：默认原生 = flat（扁平极简）；甜品黏土 = clay（立体黏土）；其余主题各有专属 style key
    const STYLE_MAP = { native:'flat', dessert:'clay', literary:'line', pet:'pet', pixel:'pixel', petal:'petal', geo:'geo', fruit:'fruit', fresh:'fresh' };
    const themeStyle = STYLE_MAP[s.theme] || 'flat';
    document.documentElement.setAttribute('data-theme', s.theme || 'native');
    document.documentElement.setAttribute('data-theme-style', themeStyle);
    document.documentElement.setAttribute('data-icons', base);
    document.documentElement.setAttribute('data-mode', isNight?'night':'day');

    const t = THEMES[s.theme] || THEMES.native;
    const root = document.documentElement.style;
    const set=(k,v)=>root.setProperty(k,v);

    // DIY 自定义主题优先
    const diy = (s.activeDiy!=null) ? (s.diyThemes||[]).find(d=>d.id===s.activeDiy) : null;
    if(diy) form = (diy.iconForm && diy.iconForm!=='auto') ? diy.iconForm : (ICON_AUTO[s.theme]||'line');
    const L = Math.max(0,Math.min(3, (diy? (diy.cuteLevel||0):0)|0));
    let radii = (base==='cute') ? [20,14,28,14] : [16,10,22,9];

    const fruitEmoji = diy ? (diy.fruitEmoji||t.emoji) : t.deco;

    if(diy){
      const c = diy.colors || {};
      set('--primary', c.primary||t.primary);
      set('--primary-bg', c.sidebarBg||c.primaryBg||t.primaryBg);
      set('--primary-text', c.heading||t.primaryText);
      set('--bg', c.contentBg||t.bg);
      set('--card-bg', c.cardBg||'#FFFFFF');
      set('--divider', c.divider||t.divider);
      set('--border', t.border);
      set('--text', c.body||t.text);
      set('--text-sub', c.sidebarText||t.textSub);
      set('--text-light', c.sidebarText||t.textSub);
      set('--menu-active', c.menuActive||t.menuActive);
      set('--warning', c.warning||'#D83636');
      set('--heading-color', c.heading||t.text);
      set('--sidebar-bg', c.sidebarBg||t.card);
      set('--sidebar-text', c.sidebarText||t.textSub);
      set('--progress-color', c.progress||c.primary||t.primary);
      set('--fab-color', c.fab||c.primary||t.primary);
      set('--deco-color', c.deco||c.primary||t.primary);
      set('--deco-fruit', '"'+(diy.fruitEmoji||t.deco)+'"');
      set('--deco-opacity','0.12');
      set('--bg-texture', this.bgTextureCSS(diy.bg));
      const app=document.getElementById('app');
      if(app){
        app.classList.toggle('no-deco-fruit', !(diy.deco&&diy.deco.fruit));
        app.classList.toggle('no-deco-star', !(diy.deco&&diy.deco.star));
        app.classList.toggle('no-deco-cloud', !(diy.deco&&diy.deco.cloud));
      }
    } else {
      set('--primary', t.primary);
      set('--primary-bg', t.primaryBg);
      set('--primary-text', t.primaryText);
      set('--bg', t.bg);
      set('--card-bg', t.card);
      set('--divider', t.divider);
      set('--border', t.border);
      set('--text', t.text);
      set('--text-sub', t.textSub);
      set('--text-light', t.textSub);
      set('--menu-active', t.menuActive);
      set('--warning', '#D83636');
      set('--heading-color', t.text);
      set('--sidebar-bg', t.card);
      set('--sidebar-text', t.textSub);

  /* 构建全屏低透明度水果 / 星星 / 云朵装饰（2.2.5） */
  buildDecoLayer(fruit, isNight){
    const layer=document.getElementById('decoLayer'); if(!layer) return;
    if(isNight){ layer.innerHTML=''; return; }
    const stars=['⭐','✨','🌟']; const clouds=['☁️','☁'];
    const pos=[
      {cls:'dl-fruit',x:'4%',y:'13%',r:'0deg',s:1},
      {cls:'dl-fruit',x:'89%',y:'20%',r:'12deg',s:1.2},
      {cls:'dl-fruit',x:'9%',y:'82%',r:'-10deg',s:.9},
      {cls:'dl-fruit',x:'85%',y:'76%',r:'8deg',s:1.1},
      {cls:'dl-star',x:'32%',y:'42%',r:'0deg',s:1},
      {cls:'dl-star',x:'68%',y:'56%',r:'0deg',s:1},
      {cls:'dl-star',x:'52%',y:'89%',r:'0deg',s:1},
      {cls:'dl-cloud',x:'62%',y:'7%',r:'0deg',s:1},
      {cls:'dl-cloud',x:'18%',y:'62%',r:'0deg',s:1},
    ];
    layer.innerHTML = pos.map(p=>{
      const ch = p.cls==='dl-fruit'?fruit : (p.cls==='dl-star'? stars[(Math.random()*stars.length)|0] : clouds[(Math.random()*clouds.length)|0]);
      return `<div class="dl ${p.cls}" style="left:${p.x};top:${p.y};transform:rotate(${p.r}) scale(${p.s})">${ch}</div>`;
    }).join('');

  /* 背景纹理 CSS（内置六类 + 自定义图片） */

    if(!bg) return 'none';

    switch(bg.texture){
      case 'stars': return 'radial-gradient(circle, rgba(140,140,140,.08) 1.4px, transparent 1.5px) 0 0/22px 22px';
      case 'dots':  return 'radial-gradient(circle, rgba(140,140,140,.07) 3px, transparent 3.1px) 0 0/26px 26px';
      case 'grid':  return 'linear-gradient(rgba(140,140,140,.07) 1px, transparent 1px) 0 0/20px 20px, linear-gradient(90deg, rgba(140,140,140,.07) 1px, transparent 1px) 0 0/20px 20px';
      case 'leaves':return 'radial-gradient(circle at 30% 30%, rgba(140,140,140,.07) 2px, transparent 2.1px) 0 0/30px 30px';
      case 'fruit': return 'radial-gradient(circle, rgba(150,150,150,.06) 4px, transparent 4.1px) 0 0/34px 34px';
      default: return 'none';
    }
  },

/* ============ 回收站统一数据层 ============
   所有删除行为（批量 / 单条）统一软删除至回收站，不直接永久销毁。
   recycleBin 记录结构：
   { binId, type:'project'|'case', deletedAt(ISO), originGroup(归属分组标签),
     originKey(复原定位), wholeGroup(整组删除?), count, data(原始对象) } */
const Bin = {
  push(rec){
    Store.data.recycleBin.unshift({
      binId: uid('bin'),
      type: rec.type,
      deletedAt: new Date().toISOString(),
      originGroup: rec.originGroup || '',
      originKey: rec.originKey || null,
      wholeGroup: !!rec.wholeGroup,
      count: rec.count || 1,
      data: rec.data
    });
    Store.save();
  },
  // 复原单条：数据恢复至原始对应父分组；父分组已被回收则自动重建
  restore(binId){
    const bin = Store.data.recycleBin.find(r=>r.binId===binId);
    if(!bin) return;
    if(bin.type==='project'){
      if(bin.wholeGroup){
        const comp = JSON.parse(JSON.stringify(bin.data));
        const exist = Store.data.projects.find(p=>p.id===comp.id);
        if(exist){ // 父分组已存在 → 合并缺失的子项
          comp.items.forEach(it=>{ if(!exist.items.find(i=>i.id===it.id)) exist.items.push(it); });
        } else {
          Store.data.projects.push(comp);
        }
      } else {
        const item = bin.data, key = bin.originKey||{};
        let comp = Store.data.projects.find(p=>p.id===key.companyId);
        if(!comp){
          comp = { id:key.companyId, company:key.companyName||'未命名公司', items:[] };
          Store.data.projects.push(comp);
        }
        if(!comp.items.find(i=>i.id===item.id)) comp.items.push(item);
      }
    } else { // case
      const cs = JSON.parse(JSON.stringify(bin.data));
      if(!Store.data.cases.find(c=>c.id===cs.id)) Store.data.cases.push(cs);
    }
    Store.data.recycleBin = Store.data.recycleBin.filter(r=>r.binId!==binId);
    Store.save();
  },
  purge(binId){
    Store.data.recycleBin = Store.data.recycleBin.filter(r=>r.binId!==binId);
    Store.save();
  },
  clearAll(){
    Store.data.recycleBin = [];
    Store.save();
  },
  list(type){
    return Store.data.recycleBin.filter(r=>r.type===type);
  }
};

/* ============ 悬浮按钮 ============ */
const Fab = {
  el:null, menuEl:null, dragging:false, moved:false, sx:0, sy:0, startLeft:0, startTop:0,
  init(){
    this.el = document.getElementById('fab');
    this.menuEl = document.getElementById('fabMenu');
    if(!this.el) return;
    this.loadPos();
    this.bindDrag();
  },
  loadPos(){
    var p = (Store.data.settings && Store.data.settings.fabPos) || null;
    if(p && typeof p.x==='number' && typeof p.y==='number'){
      this.el.style.left = p.x+'px';
      this.el.style.top = p.y+'px';
      this.el.style.right='auto';
      this.el.style.bottom='auto';
    }
  },
  savePos(){
    if(!this.el) return;
    var r = this.el.getBoundingClientRect();
    if(!Store.data.settings) Store.data.settings = {};
    Store.data.settings.fabPos = {x:Math.round(r.left), y:Math.round(r.top)};
    if(Store.save) Store.save();
  },
  bindDrag(){
    var self=this, el=this.el, lastTouch=0;
    function down(x,y){
      self.dragging=true; self.moved=false;
      var r=el.getBoundingClientRect();
      self.startLeft=r.left; self.startTop=r.top;
      self.sx=x; self.sy=y;
      el.style.transition='none';
      el.classList.add('dragging');
      self.close();
    }
    function move(x,y){
      if(!self.dragging) return;
      var dx=x-self.sx, dy=y-self.sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4) self.moved=true;
      var w=el.offsetWidth, h=el.offsetHeight;
      var nx=self.startLeft+dx, ny=self.startTop+dy;
      nx=Math.max(4, Math.min(nx, window.innerWidth-w-4));
      ny=Math.max(4, Math.min(ny, window.innerHeight-h-4));
      el.style.left=nx+'px'; el.style.top=ny+'px';
      el.style.right='auto'; el.style.bottom='auto';
    }
    function up(){
      if(!self.dragging) return;
      self.dragging=false;
      el.classList.remove('dragging');
      // 松手吸附至最近一侧（左/右）靠边
      var r=el.getBoundingClientRect();
      var w=el.offsetWidth;
      var center=r.left+w/2;
      var nx = center < window.innerWidth/2 ? 4 : (window.innerWidth-w-4);
      el.style.transition='left .2s, top .2s';
      el.style.left=nx+'px';
      self.savePos();
      if(!self.moved){ self.toggle(); } // 未滑动=点击，触发新建菜单
    }
    el.addEventListener('touchstart', function(e){ lastTouch=Date.now(); var t=e.touches[0]; down(t.clientX,t.clientY); }, {passive:true});
    el.addEventListener('touchmove', function(e){ var t=e.touches[0]; move(t.clientX,t.clientY); if(self.moved && e.cancelable) e.preventDefault(); }, {passive:false});
    el.addEventListener('touchend', up);
    el.addEventListener('mousedown', function(e){ if(Date.now()-lastTouch<600) return; down(e.clientX,e.clientY); });
    window.addEventListener('mousemove', function(e){ if(Date.now()-lastTouch<600) return; move(e.clientX,e.clientY); });
    window.addEventListener('mouseup', up);
  },
  toggle(){
    var menu=this.menuEl, el=this.el;
    if(!menu||!el) return;
    if(menu.classList.contains('show')){ menu.classList.remove('show'); return; }
    menu.classList.add('show');
    var r=el.getBoundingClientRect();
    var mh=menu.offsetHeight||120;
    menu.style.left=r.left+'px';
    menu.style.top=Math.max(8, r.top-mh-10)+'px';
    menu.style.right='auto'; menu.style.bottom='auto';
  },
  close(){
    if(this.menuEl) this.menuEl.classList.remove('show');
  },
  // 按当前页面渲染悬浮加号菜单（工具页启用上下文相关的新增动作）
  renderMenuFor(page){
    const m=this.menuEl; if(!m) return;

      m.innerHTML = `<div class="fab-item" onclick="JudgeMemo.fabAdd()">${JudgeMemo.curCourt?'👤 新增法官':'🏛 新增法院'}</div>` +
        (JudgeMemo.curCourt?`<div class="fab-item" onclick="JudgeMemo.openAddCourt()">🏛 新增法院</div>`:'');
    } else if(page==='auctionDate'){
      m.innerHTML = `<div class="fab-item" onclick="AuctionDate.saveFromFab()">💾 保存到记录</div>`;
    } else if(page==='auctionPrice'){

    } else if(page==='tools'){
      m.innerHTML = `<div class="fab-item" onclick="Nav.go('judgeMemo')">🏛 法院法官备忘录</div>`;
    } else {
      m.innerHTML = `<div class="fab-item" onclick="Fab.action('todo')">📋 新增待办</div><div class="fab-item" onclick="Fab.action('project')">📁 新增项目</div><div class="fab-item" onclick="Fab.action('case')">⚖️ 新增案件</div>`;
    }
  },
  action(type){

    if(type==='todo'){ if(Nav.current!=='todo') Nav.go('todo'); Sheet.open('新增待办',`
      <div class="form-group"><label>待办内容</label><input id="fb_todo" placeholder="输入待办..."></div>
      <div class="form-group"><label>截止日期</label><input type="date" id="fb_date" value="${Store.dateStr(0)}"></div>
      <div class="btn-row"><button class="btn-cancel" onclick="Sheet.close()">取消</button>

    else if(type==='project'){ if(Nav.current!=='project') Nav.go('project'); Sheet.open('新增公司',`
      <div class="form-group"><label>公司/客户名称</label><input id="fb_company" placeholder="请输入名称"></div>

      <button class="btn-save" onclick="Fab.saveCompany()">添加</button></div>
    `); }
    else if(type==='case'){ Nav.go('case'); Cases.add(); }
  },
