<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知微">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd9a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>知微工作台</title>
<style>
/* ============ 主题变量系统 ============
   两层视觉体系：
   ① 默认原生简约主题（flat）—— 软件初次打开 / 未手动切换时的初始默认：
      浅线描扁平图标、低饱和淡奶油白底、轻度圆角、无 3D 黏土浮雕。
   ② 预设治愈主题专区（马卡龙 / 甜美两大色系）—— 7 套成套治愈主题，每套绑定专属折叠箭头样式，切换全页面统一生效。
   实际变量由 Appearance.applyTheme() 注入，此处为初始兜底值。 */
:root,
[data-theme="native"]{
  /* —— 默认原生简约主题（办公室极简奶油风 · flat） —— */
  --primary:#7E9B8E; --primary-light:#A6BEB2; --primary-text:#4F6B5D; --primary-bg:#EAF0EC;
  --bg:#FAF8F2; --card-bg:#FFFFFF; --menu-active:#F1EEE6;
  --text:#3A443D; --text-sub:#8A9389; --text-light:#C3C9C4;
  --warning:#D83636; --company:#52A052; --court:#3B7EC4; --auction:#E8923C;
  --border:#E6E0D4; --divider:#ECE6DB; --shadow:rgba(126,155,142,.12);
  --radius:16px; --radius-sm:10px; --radius-lg:22px; --radius-icon:9px;
  --icon-stroke:2; --icon-fill:none; --icon-cap:round;
  /* —— DIY / 装饰 扩展变量 —— */
  --sidebar-bg:var(--card-bg);   /* 导航栏背景（DIY 可覆盖） */
  --sidebar-text:var(--text-sub);/* 导航文字（DIY 可覆盖） */
  --heading-color:var(--text);   /* 标题文字（DIY 可覆盖） */
  --progress-color:var(--primary);/* 进度条（DIY 可覆盖） */
  --fab-color:var(--primary);    /* 悬浮按钮（DIY 可覆盖） */
  --deco-color:var(--primary);   /* 装饰点缀色（DIY 可覆盖） */
  --deco-fruit:"🌿";                /* 当前主题装饰水果 emoji */
  --deco-opacity:.12;            /* 装饰透明度 */
  --cute-level:0;                /* 可爱化强度 0-3 */
  --bg-texture:none;             /* 背景纹理 */
}
/* 各主题兜底（applyTheme 会再注入精确值，这里用于 data-theme 选择器降级） */
[data-theme="dessert"]{
  --primary:#E8A0A8; --primary-bg:#FBE9EC; --primary-text:#B86B73; --bg:#FFF6F4;
  --card-bg:#FFFFFF; --menu-active:#FFE6EC; --text:#5A4045; --text-sub:#B59298;
  --border:#F2D4DA; --divider:#F6DDE2; --shadow:rgba(232,160,168,.14);
}
[data-theme="literary"]{
  --primary:#9AAE96; --primary-bg:#EEF2EA; --primary-text:#6E8169; --bg:#FAFAF6;
  --card-bg:#FFFFFF; --menu-active:#EFF3EA; --text:#46493F; --text-sub:#8C9182;
  --border:#E2E7DC; --divider:#E8ECE3; --shadow:rgba(154,174,150,.12);
}
[data-theme="pet"]{
  --primary:#E0A878; --primary-bg:#F7EADC; --primary-text:#B07C4E; --bg:#FFF8F0;
  --card-bg:#FFFFFF; --menu-active:#FFEEDD; --text:#5A4636; --text-sub:#B09681;
  --border:#ECE0CC; --divider:#F0E2D0; --shadow:rgba(224,168,120,.12);
}
[data-theme="pixel"]{
  --primary:#7FC9B8; --primary-bg:#E2F4EF; --primary-text:#4E9888; --bg:#F2FBF8;
  --card-bg:#FFFFFF; --menu-active:#E4F6F1; --text:#345049; --text-sub:#79A89C;
  --border:#D2EBE2; --divider:#D8EEE7; --shadow:rgba(127,201,184,.12);
}
[data-theme="petal"]{
  --primary:#D9A7C4; --primary-bg:#F6E8F1; --primary-text:#A9708F; --bg:#FDF4FA;
  --card-bg:#FFFFFF; --menu-active:#FBE7F4; --text:#4F3D49; --text-sub:#AD8CA2;
  --border:#ECDCED; --divider:#F0DCEA; --shadow:rgba(217,167,196,.12);
}
[data-theme="geo"]{
  --primary:#8FA8C9; --primary-bg:#E9EFF6; --primary-text:#5F789A; --bg:#F6F8FB;
  --card-bg:#FFFFFF; --menu-active:#EAF0F8; --text:#3E4654; --text-sub:#8595AB;
  --border:#DBE4EF; --divider:#E0E8F1; --shadow:rgba(143,168,201,.12);
}
[data-theme="fruit"]{
  --primary:#8FB86A; --primary-bg:#EEF4E2; --primary-text:#5E8045; --bg:#F7FBEF;
  --card-bg:#FFFFFF; --menu-active:#EFF5E2; --text:#3F4A33; --text-sub:#87A06E;
  --border:#DCE8CC; --divider:#E2ECD3; --shadow:rgba(143,184,106,.12);
}
/* 🍑 活泼轻新 - 暖米白+珊瑚橙 兜底 */
[data-theme="fresh"]{
  --primary:#EE8A5F; --primary-bg:#FDEEE6; --primary-text:#B66040; --bg:#FFF7F0;
  --card-bg:#FFFFFF; --menu-active:#FDEEE6; --text:#4A3526; --text-sub:#B0937E;
  --company:#E8A66B; --court:#D87A5C; --auction:#EE8A5F;
  --warning:#E5635C; --border:#F0D5BC; --divider:#F5E2D2; --shadow:rgba(238,138,95,.18);
  --radius:14px; --radius-sm:10px; --radius-lg:22px; --radius-icon:11px;
}
/* 可爱基底放大圆角 + 圆润图标 */
[data-icons="cute"]{
  --radius:22px; --radius-sm:16px; --radius-lg:30px; --radius-icon:16px;
  --icon-stroke:2.5; --icon-cap:round;
}

/* ============ 视觉风格分级：flat（默认原生简约） / clay（甜品黏土 3D） / 其余主题专属 style key ============ */
/* —— 默认原生简约（flat）：扁平、无浮雕、近零阴影、极简装饰 —— */
html[data-theme-style="flat"] .card{
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  border:1px solid var(--border);
}
html[data-theme-style="flat"] .card::after{ display:none; }   /* 默认原生不渲染卡片角标水果 */
html[data-theme-style="flat"] #decoLayer{ display:none; }    /* 仅保留侧边导航角落小型平面水果 */
html[data-theme-style="flat"] .nav-item .ic{ border-radius:var(--radius-sm); }
html[data-theme-style="flat"] .fruit-deco{ filter:none; opacity:.42; }
html[data-theme-style="flat"] .btn-save,
html[data-theme-style="flat"] .diy-btn,
html[data-theme-style="flat"] .io-btn,
html[data-theme-style="flat"] .filter-chip,
html[data-theme-style="flat"] .remind-tag,
html[data-theme-style="flat"] .mode-card,
html[data-theme-style="flat"] .theme-card,
html[data-theme-style="flat"] .icon-style-card{ box-shadow:none; }

/* —— 甜品黏土（clay）：立体黏土质感，全页面统一生效 —— */
/* 导航图标：大圆角方块底托 + 浮雕高光 + 轻微抬起 + 柔和外阴影 + 哑光磨砂 */
html[data-theme-style="clay"] .nav-item .ic{
  width:34px;height:34px;border-radius:13px;background:var(--primary-bg);
  box-shadow:0 4px 9px var(--shadow), inset 0 2px 2px rgba(255,255,255,.6), inset 0 -3px 4px rgba(0,0,0,.05);
}
html[data-theme-style="clay"] .nav-item .ic svg{ width:22px;height:22px; }
html[data-theme-style="clay"] .nav-item.active .ic{
  background:var(--primary);
  box-shadow:0 5px 12px var(--shadow), inset 0 2px 3px rgba(255,255,255,.45), inset 0 -3px 5px rgba(0,0,0,.08);
}
html[data-theme-style="clay"] .nav-item.active .ic svg{ stroke:#fff; }
html[data-theme-style="clay"] #app.app-collapsed .nav-item .ic{ width:34px;height:34px; }
/* 卡片：浮起黏土 + 顶部高光 */
html[data-theme-style="clay"] .card{
  box-shadow:0 6px 16px var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.55);
}
/* 按钮 / 标签 / 控件：浮起黏土软萌立体 */
html[data-theme-style="clay"] .btn-save,
html[data-theme-style="clay"] .diy-btn,
html[data-theme-style="clay"] .io-btn,
html[data-theme-style="clay"] .filter-chip,
html[data-theme-style="clay"] .remind-tag,
html[data-theme-style="clay"] .mode-card,
html[data-theme-style="clay"] .theme-card,
html[data-theme-style="clay"] .icon-style-card,
html[data-theme-style="clay"] .sidebar-footer .io-btn{
  box-shadow:0 3px 8px var(--shadow), inset 0 1px 0 rgba(255,255,255,.5);
}
html[data-theme-style="clay"] .filter-chip.active,
html[data-theme-style="clay"] .mode-card.active,
html[data-theme-style="clay"] .icon-style-card.active,
html[data-theme-style="clay"] .fruit-card.active{
  box-shadow:0 4px 10px var(--shadow), inset 0 2px 3px rgba(0,0,0,.06);
}
/* 角标水果：黏土小球观感 */
html[data-theme-style="clay"] .fruit-deco{ transform:scale(1.08); filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)); }

/* ============ 🍑 活泼轻新（fresh）风格 ============
   暖米白 + 珊瑚橙 · 柔和暖光阴影 · 卡片左侧色条 · 树形标题淡橙底强调
   状态徽章珊瑚色 · 圆角浮起 · 不甜腻 */
html[data-theme-style="fresh"]{
  --radius:14px; --radius-sm:10px; --radius-lg:22px; --radius-icon:11px;
  --icon-stroke:2; --icon-cap:round;
}
/* 卡片：暖色浮起 + 左侧细色条 */
html[data-theme-style="fresh"] .card{
  background:var(--card-bg);
  border:1px solid var(--border);
  box-shadow:0 4px 12px var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
  border-left:3px solid var(--primary);
}
html[data-theme-style="fresh"] .card::after{ display:none; }
/* 树形分组标题：淡橙底强调 */
html[data-theme-style="fresh"] .tree-head,
html[data-theme-style="fresh"] .group-title,
html[data-theme-style="fresh"] .case-group .group-title,
html[data-theme-style="fresh"] .project-group .group-title{
  background:linear-gradient(180deg, var(--primary-bg) 0%, transparent 100%);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  font-weight:600;
  color:var(--primary-text);
}
html[data-theme-style="fresh"] .case-group .group-title::before,
html[data-theme-style="fresh"] .project-group .group-title::before{
  background:var(--primary);
}
/* 案件 / 项目 卡片：白底 + 暖色细边 + 左侧色条 */
html[data-theme-style="fresh"] .case-card,
html[data-theme-style="fresh"] .brief-card,
html[data-theme-style="fresh"] .case-item,
html[data-theme-style="fresh"] .project-card,
html[data-theme-style="fresh"] .todo-card,
html[data-theme-style="fresh"] .time-card,
html[data-theme-style="fresh"] .data-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-left:3px solid var(--primary);
  box-shadow:0 2px 6px var(--shadow);
  border-radius:var(--radius);
}
/* 状态徽章：珊瑚色 pill */
html[data-theme-style="fresh"] .case-badge,
html[data-theme-style="fresh"] .status-badge,
html[data-theme-style="fresh"] .tag-status,
html[data-theme-style="fresh"] .remind-tag.remind-pending,
html[data-theme-style="fresh"] .status-pending,
html[data-theme-style="fresh"] .warn-tag,
html[data-theme-style="fresh"] .tag-pending,
html[data-theme-style="fresh"] .badge-pending,
html[data-theme-style="fresh"] .badge-unfinished,
html[data-theme-style="fresh"] .case-unfinished{
  background:var(--primary-bg);
  color:var(--primary-text);
  border:1px solid var(--primary);
  border-radius:999px;
  padding:2px 10px;
  font-weight:600;
}
/* 通用警告红也用 coral 系（更暖） */
html[data-theme-style="fresh"] .remind-tag.remind-done,
html[data-theme-style="fresh"] .status-done,
html[data-theme-style="fresh"] .tag-done,
html[data-theme-style="fresh"] .badge-done{
  background:#E8F5E9;
  color:#5C8A52;
  border:1px solid #B6D8B7;
  border-radius:999px;
}
/* 按钮：浮起暖光 */
html[data-theme-style="fresh"] .btn-save,
html[data-theme-style="fresh"] .diy-btn,
html[data-theme-style="fresh"] .io-btn{
  background:linear-gradient(180deg, #FFA876 0%, var(--primary) 100%);
  color:#fff;
  border:1px solid var(--primary);
  box-shadow:0 3px 8px var(--shadow), inset 0 1px 0 rgba(255,255,255,.4);
}
html[data-theme-style="fresh"] .btn-save:hover,
html[data-theme-style="fresh"] .diy-btn:hover,
html[data-theme-style="fresh"] .io-btn:hover{
  background:linear-gradient(180deg, #FFB689 0%, #E27A4F 100%);
}
html[data-theme-style="fresh"] .filter-chip,
html[data-theme-style="fresh"] .mode-card,
html[data-theme-style="fresh"] .icon-style-card,
html[data-theme-style="fresh"] .theme-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  box-shadow:0 2px 6px var(--shadow);
  border-radius:var(--radius);
}
html[data-theme-style="fresh"] .filter-chip.active,
html[data-theme-style="fresh"] .mode-card.active,
html[data-theme-style="fresh"] .icon-style-card.active,
html[data-theme-style="fresh"] .theme-card.active{
  background:var(--primary-bg);
  border:1.5px solid var(--primary);
  color:var(--primary-text);
  box-shadow:0 3px 9px var(--shadow), inset 0 1px 0 rgba(255,255,255,.5);
}
/* 顶部筛选条 pill 化 */
html[data-theme-style="fresh"] .view-toggle-bar,
html[data-theme-style="fresh"] .filter-bar,
html[data-theme-style="fresh"] .view-tabs{
  background:transparent;
}
html[data-theme-style="fresh"] .view-toggle-bar .filter-chip{
  border-radius:999px;
  padding:6px 14px;
}
/* 装饰层降低饱和、弱化 */
html[data-theme-style="fresh"] .fruit-deco,
html[data-theme-style="fresh"] #decoLayer .fruit-deco{
  filter:saturate(1.1) drop-shadow(0 1px 2px rgba(238,138,95,.2));
}
html[data-theme-style="fresh"] #decoLayer{ opacity:.55; }
/* 案件状态：未完成 状态徽章暖色提醒 */
html[data-theme-style="fresh"] .unfinished-badge,
html[data-theme-style="fresh"] .pending-tag,
html[data-theme-style="fresh"] [class*="unfinished"],
html[data-theme-style="fresh"] [class*="-pending"]{
  background:linear-gradient(180deg, #FFB79A 0%, var(--primary) 100%);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:2px 10px;
  font-weight:600;
  box-shadow:0 1px 3px var(--shadow);
}

/* ============ 全局重置 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  transition:background .3s,color .3s;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;border:none;outline:none;background:none;color:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:0;height:0;}
input,textarea{width:100%;}
.checkbox{
  width:22px;height:22px;border:2px solid var(--primary);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;
}
.checkbox.on{background:var(--primary);}
.checkbox.on::after{content:"✓";color:#fff;font-size:13px;font-weight:bold;}
[data-icons="cute"] .checkbox{border-radius:50%;width:24px;height:24px;}

/* ============ 手机容器 ============ */
#app{
  display:flex;height:100%;width:100%;max-width:480px;margin:0 auto;position:relative;
  box-shadow:0 0 40px var(--shadow);overflow:hidden;
}

/* ============ 左侧导航 ============ */
#sidebar{
  width:28%;min-width:96px;max-width:130px;background:var(--sidebar-bg);
  display:flex;flex-direction:column;border-right:1px solid var(--border);
  transition:all .3s;z-index:10;
}
.sidebar-header{
  padding:14px 8px 10px;text-align:center;
  border-bottom:1px solid var(--divider);
}
.sidebar-header .logo{
  width:38px;height:38px;border-radius:var(--radius-sm);
  background:var(--primary);display:flex;align-items:center;justify-content:center;
  margin:0 auto 6px;color:#fff;font-size:20px;object-fit:cover;
}
.sidebar-header .logo img{
  width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;
}
[data-icons="cute"] .sidebar-header .logo{border-radius:50%;}
.sidebar-header .name{font-size:12px;font-weight:700;color:var(--sidebar-text);}
.nav-list{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;cursor:pointer;transition:all .2s;position:relative;
}
.nav-item .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.nav-item .ic svg{width:24px;height:24px;stroke:var(--text-sub);fill:none;stroke-width:var(--icon-stroke);stroke-linecap:var(--icon-cap);stroke-linejoin:round;transition:all .2s;}
[data-icons="cute"] .nav-item .ic svg{stroke-width:2.2;}
.nav-item .lbl{font-size:10px;color:var(--sidebar-text);transition:color .2s;text-align:center;line-height:1.2;}
.nav-item.active{background:var(--menu-active);}
.nav-item.active .ic svg{stroke:var(--primary);}
.nav-item.active .lbl{color:var(--primary);font-weight:600;}
.nav-item.active::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:24px;background:var(--primary);border-radius:0 3px 3px 0;
}

.sidebar-footer{
  border-top:1px solid var(--divider);padding:8px 4px 12px;
}
.sidebar-footer .io-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;cursor:pointer;transition:all .2s;
}
.sidebar-footer .io-btn svg{width:20px;height:20px;stroke:var(--text-sub);fill:none;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round;}
.sidebar-footer .io-btn .lbl{font-size:9px;color:var(--text-sub);}
.sidebar-footer .io-btn:active{opacity:.6;}

/* ============ 抽屉折叠（三线切换） ============ */
.hamburger{
  width:34px;height:34px;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  padding:6px;border-radius:var(--radius-sm);transition:background .2s;flex-shrink:0;
}
.hamburger:active{background:var(--primary-bg);}
.hamburger span{display:block;height:2px;width:20px;background:var(--text-sub);border-radius:2px;transition:all .3s;}
.app-collapsed .hamburger span{background:var(--primary);}

/* 折叠态：纯图标窄栏（更细 44px） */
#app.app-collapsed #sidebar{width:44px;min-width:44px;max-width:44px;}
#app.app-collapsed .sidebar-header{padding:10px 2px 8px;}
#app.app-collapsed .sidebar-header .name{display:none;}
#app.app-collapsed .nav-item{flex-direction:column;padding:8px 1px 8px;gap:1px;}
#app.app-collapsed .nav-item .lbl{display:none;}
#app.app-collapsed .nav-item .ic{width:28px;height:28px;}
#app.app-collapsed .nav-item .ic svg{width:22px;height:22px;}
#app.app-collapsed .nav-item .ic .fruit-deco{font-size:9px;}
#app.app-collapsed .sidebar-footer{padding:6px 2px 10px;}
#app.app-collapsed .sidebar-footer .io-btn{flex-direction:column;padding:8px 1px 8px;gap:0;}
#app.app-collapsed .sidebar-footer .io-btn .lbl{display:none;}
#app.app-collapsed .hamburger{width:30px;height:30px;padding:4px;}
#app.app-collapsed .hamburger span{width:18px;}
[data-icons="cute"] #app.app-collapsed #sidebar .logo{border-radius:50%;}

/* ============ 右侧内容区 ============ */
#main{flex:1;overflow-y:auto;position:relative;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--divider);
  background:var(--card-bg);position:sticky;top:0;z-index:5;min-height:44px;
}
.topbar .title{font-size:15px;font-weight:700;color:var(--heading-color);text-align:center;flex:1;}
.topbar .left-slot,.topbar .right-slot{min-width:32px;display:flex;align-items:center;gap:8px;}
.topbar .right-slot{justify-content:flex-end;}

.content{flex:1;overflow-y:auto;padding:12px;}

/* 筛选栏 */
.filter-bar{
  display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;
}
.filter-chip{
  padding:5px 14px;border-radius:20px;font-size:12px;
  background:var(--primary-bg);color:var(--text-sub);cursor:pointer;transition:all .2s;
}
.filter-chip.active{background:var(--primary);color:#fff;font-weight:600;}

/* ============ 卡片通用 ============ */
.card{
  background:var(--card-bg);border-radius:var(--radius);padding:14px;
  margin-bottom:12px;box-shadow:0 2px 8px var(--shadow);
  transition:all .3s;
}
.card-title{
  font-size:13px;font-weight:700;color:var(--heading-color);margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.card-title .dot{width:4px;height:14px;background:var(--primary);border-radius:2px;}

/* ============ 首页：时间卡片（半透纹样 · 三段式：时间 + 待办统计 + 金句嵌入右半侧） ============ */
.time-card{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  display:grid;
  grid-template-columns:auto auto minmax(0,1fr);
  align-items:stretch;
  gap:8px;
  /* 半透明同色底色：极低浓度，让下层页面真的"透"出来，无任何描边 */
  background:transparent;
  background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 7%, transparent), color-mix(in srgb, var(--primary-light) 16%, transparent));
  color:var(--primary-text);
  border:none;
  outline:none;
  box-shadow:none;
  border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;
  min-height:96px;
}
/* 底层暗纹：极低透明度 · 细枝叶肌理（背景层 z=0），不与文字抢视觉 */
.time-card::after{
  content:'';
  position:absolute;inset:0;
  background-repeat:repeat;
  opacity:.09;            /* 极低对比：肌理而不争视觉焦点 */
  z-index:0;
  pointer-events:none;
}
.time-card > *{position:relative;z-index:1;}
/* 右上角主题装饰图标：低调不抢字，随主题切换（图层位于底色/暗纹之上、文字之下） */
.time-card .tc-deco{
  position:absolute;
  top:6px;right:8px;
  font-size:16px;line-height:1;
  opacity:.35;
  z-index:1;
  pointer-events:none;
  user-select:none;
}
/* 单一分区：左侧时间区（时分 / 公历日期 / 农历） */
.time-card .tc-zone{display:flex;flex-direction:column;justify-content:center;min-width:0;}
.time-card .tc-left{text-align:left;}

/* 右侧：3 组待办统计（数字 + 文字：今日待办 / 全部待办 / 预警案件） */
.time-card .tc-right{flex-direction:row;justify-content:space-around;align-items:center;gap:4px;flex:1;}
.time-card .tc-right .stat-item{flex:1;text-align:center;cursor:pointer;min-width:0;padding:0 2px;}
.time-card .tc-right .stat-item .num{font-size:18px;font-weight:700;line-height:1.1;}
.time-card .tc-right .stat-item .lbl{font-size:10px;opacity:.78;margin-top:3px;}

/* 分区细分隔线：极淡，仅做视觉分段 */
.time-card .tc-divider{
  width:1px;align-self:stretch;
  background:color-mix(in srgb, var(--primary-text) 10%, transparent);
  margin:0 -2px;
}
.time-card .left .clock{font-size:28px;font-weight:300;letter-spacing:1px;line-height:1.1;}
.time-card .left .date{font-size:11px;opacity:.82;margin-top:3px;}
.time-card .left .lunar{font-size:10px;opacity:.7;margin-top:2px;}

/* 时间卡片底层暗纹：9 套主题专属低透明度暗纹（切换主题同步更换） */

.todo-stat{
  display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--divider);
}
.todo-stat .stat-item{flex:1;text-align:center;}
.todo-stat .stat-item .num{font-size:20px;font-weight:700;}
.todo-stat .stat-item .lbl{font-size:10px;opacity:.8;}

/* ============ 首页：待办汇总 / 每日任务备忘录 — 单条统一结构 ============ */
.todo-item{
  display:flex;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px dashed var(--divider);
}
.todo-item:last-child{border-bottom:none;}
.todo-item .checkbox{
  width:22px;height:22px;border:2px solid var(--primary);border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;
}
.todo-item .checkbox.on{background:var(--primary);}
.todo-item .checkbox.on::after{content:"✓";color:#fff;font-size:13px;font-weight:bold;line-height:1;}
.todo-item .info{flex:1;min-width:0;}
.todo-item .info .name{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.todo-item .info .name.done{text-decoration:line-through;color:var(--text-light);font-weight:400;}
.todo-item .tag{
  font-size:9px;padding:2px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;
}
/* 时间文字：深绿加粗；完成态同步删除线、变淡 */
.todo-time{
  color:var(--primary-text);font-weight:700;font-size:13px;flex-shrink:0;
  font-variant-numeric:tabular-nums;letter-spacing:.3px;
}
.todo-time.done{text-decoration:line-through;color:var(--text-light);font-weight:400;}
/* 还原按钮：左下角圆润柔和 */
.todo-restore{
  display:inline-flex;align-items:center;gap:4px;margin-top:12px;
  padding:7px 16px;border-radius:20px;background:var(--primary-bg);
  color:var(--primary-text);font-size:12px;cursor:pointer;
  border:1px solid var(--primary-light);transition:all .2s;
}
.todo-restore:active{transform:scale(.96);}
.tag-today{background:#FFF3CD;color:#B8860B;}
.tag-week{background:#D4EDDA;color:#155724;}
.tag-warn{background:#FFE0E0;color:var(--warning);}
.tag-overdue{background:#FFD0D0;color:#A02020;}

/* ============ 首页：进度卡片 ============ */
.progress-item{margin-bottom:10px;}
.progress-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.progress-item .head .name{font-size:12px;color:var(--text);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.progress-item .head .status{font-size:10px;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-left:6px;}
.status-prep{background:#E8E8E8;color:#666;}
.status-listing{background:var(--primary-bg);color:var(--primary-text);}
.status-bidding{background:#FFF3CD;color:#B8860B;}
.status-done{background:#D4EDDA;color:#155724;}
.status-warn{background:#FFE0E0;color:var(--warning);}
.progress-bar{height:6px;background:var(--divider);border-radius:3px;overflow:hidden;}
.progress-bar .fill{height:100%;background:var(--progress-color);border-radius:3px;transition:width .5s;position:relative;}
.progress-info{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);margin-top:3px;}

.health-row{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--divider);}
.health-item{flex:1;text-align:center;font-size:10px;}
.health-item .val{font-weight:700;}
.health-good{color:#155724;}
.health-slow{color:#B8860B;}
.health-bad{color:var(--warning);}

.case-group{margin-bottom:10px;}
.case-group .group-title{font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.case-group .group-title::before{content:"";width:3px;height:10px;background:var(--auction);border-radius:2px;}

/* ============ 待办列表 ============ */
.add-row{display:flex;gap:8px;margin-bottom:12px;}
.add-row input{
  flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card-bg);font-size:13px;color:var(--text);
}
.add-row input:focus{border-color:var(--primary);}
.add-row .btn-add{
  width:40px;height:40px;border-radius:var(--radius-sm);background:var(--primary);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
[data-icons="cute"] .add-row .btn-add{border-radius:50%;}

.date-group{margin-bottom:14px;}
.date-group .group-head{
  font-size:12px;font-weight:700;color:var(--text-sub);padding:4px 0 6px;
  display:flex;align-items:center;gap:6px;
}
.date-group .group-head .badge{
  font-size:9px;padding:1px 6px;border-radius:6px;background:var(--primary-bg);color:var(--primary);
}
.date-group .group-head .badge.overdue{background:#FFE0E0;color:var(--warning);}

.task-row{
  display:flex;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px dashed var(--divider);transition:all .2s;
}
.task-row:last-child{border-bottom:none;}
.task-row:active{transform:scale(.99);}
.task-row.warn{border-left:3px solid var(--warning);padding-left:9px;}
.task-row .checkbox{
  width:22px;height:22px;border:2px solid var(--primary);border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;cursor:pointer;
}
.task-row .checkbox.on{background:var(--primary);}
.task-row .checkbox.on::after{content:"✓";color:#fff;font-size:13px;font-weight:bold;line-height:1;}
.task-row .info{flex:1;min-width:0;}
.task-row .info .name{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-row .info .name.done{text-decoration:line-through;color:var(--text-light);font-weight:400;}
.task-row .info .meta{font-size:10px;color:var(--text-sub);margin-top:2px;}
.task-row .actions{display:flex;gap:6px;flex-shrink:0;}
.task-row .actions .act{
  width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  background:var(--primary-bg);color:var(--primary);
}
.task-row .actions .act.del{color:var(--warning);background:#FFF0F0;}
.task-row .actions .act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ============ 日历 ============ */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-header .ym{font-size:14px;font-weight:700;}
.cal-header .nav-btns{display:flex;gap:6px;}
.cal-header .nav-btns button{
  width:30px;height:30px;border-radius:var(--radius-sm);background:var(--primary-bg);
  display:flex;align-items:center;justify-content:center;color:var(--primary);
}
.cal-view-switch{display:flex;gap:4px;margin-bottom:10px;}
.cal-view-switch button{
  flex:1;padding:6px;border-radius:var(--radius-sm);font-size:12px;
  background:var(--primary-bg);color:var(--text-sub);
}
.cal-view-switch button.active{background:var(--primary);color:#fff;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-grid .dow{text-align:center;font-size:10px;color:var(--text-sub);padding:4px 0;}
.cal-grid .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:12px;border-radius:var(--radius-sm);position:relative;cursor:pointer;
  transition:all .2s;
}
.cal-grid .day.other-month{color:var(--text-light);opacity:.4;}
.cal-grid .day .dot-mark{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;
}
.cal-grid .day.today{background:var(--primary);color:#fff;font-weight:700;}
.cal-grid .day.selected{background:var(--primary-bg);font-weight:700;}
.cal-grid .day.has-event::after{
  content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;
}
.dot-company{background:var(--company);}
.dot-court{background:var(--court);}
.dot-auction{background:var(--auction);}

.cal-day-detail{margin-top:12px;}
.cal-day-detail .detail-title{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text);}
.cal-day-detail .event-item{
  display:flex;align-items:center;gap:8px;padding:8px;
  background:var(--card-bg);border-radius:var(--radius-sm);margin-bottom:6px;
}
.cal-day-detail .event-item .ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cal-day-detail .event-item .ev-name{font-size:12px;flex:1;}
.cal-day-detail .event-item .ev-time{font-size:10px;color:var(--text-sub);}

/* === 日历新样式（参考图） === */
.cal-sheet{
  background:var(--card-bg);
  border-radius:24px 24px 0 0;
  padding:18px 16px 80px;
  margin:-12px -14px 0;
  min-height:70vh;
  box-shadow:0 -4px 20px rgba(0,0,0,.04);
}
.cal-sheet .cal-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.cal-sheet .cal-title{
  font-size:20px;font-weight:700;color:var(--text);letter-spacing:.5px;
}
.cal-sheet .cal-close{
  width:30px;height:30px;border-radius:50%;
  background:var(--primary-bg);color:var(--text-sub);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;
}
.cal-month-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.cal-month-nav .cal-m-arrow{
  width:28px;height:28px;border-radius:50%;
  background:var(--primary-bg);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;font-weight:700;
}
.cal-month-nav .cal-m-title{
  font-size:15px;font-weight:700;color:var(--text);
}
.cal-grid-v2{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;
}
.cal-grid-v2 .dow{
  text-align:center;font-size:10px;color:var(--text-sub);
  padding:6px 0;font-weight:500;
}
.cal-grid-v2 .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:13px;border-radius:12px;cursor:pointer;
  background:var(--bg);color:var(--text);
  position:relative;transition:all .15s;
}
.cal-grid-v2 .day.other-month{color:var(--text-light);opacity:.5;background:transparent;}
.cal-grid-v2 .day .dot-mark{
